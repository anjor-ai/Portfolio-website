/* ================================================================
   ROUND 9 · CONTACT: "Book a time" as a compact calendar card
   A month grid and a "See times" button. The booking itself happens in Calendly, opened on
   the chosen day in a pop-up, and its frame is only loaded when someone asks for it.
   The card cannot know your availability, so it never marks a day as free or busy.
   ================================================================ */
var BK={y:0,m:0,sel:null,limit:3,opener:null};
var BK_MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var BK_DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function bkIso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function bkToday(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function bkNextWeekday(){ var d=bkToday(); do{ d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1); }while(d.getDay()===0||d.getDay()===6); return d; }
function bkTz(){ try{ return (Intl.DateTimeFormat().resolvedOptions().timeZone||'').replace(/_/g,' '); }catch(e){ return ''; } }
function bkWd(d){ return BK_DAYS[(d.getDay()+6)%7]; }
function bkUrl(d,embed){                                   /* Calendly, opened on the chosen day */
  var q=[];
  if(embed) q.push('embed_domain='+encodeURIComponent(location.hostname||'localhost'),'embed_type=Inline','background_color=111216','text_color=ebe7e2','primary_color=7560ff');
  if(d) q.push('month='+bkIso(d).slice(0,7),'date='+bkIso(d));
  return CAL.url+(q.length?'?'+q.join('&'):'');
}
function bkInit(){ var d=bkNextWeekday(); BK.sel=d; BK.y=d.getFullYear(); BK.m=d.getMonth(); }
function bkGrid(){
  var first=new Date(BK.y,BK.m,1), lead=(first.getDay()+6)%7, days=new Date(BK.y,BK.m+1,0).getDate(), today=bkToday(), h='', i, d;
  for(i=0;i<lead;i++) h+='<span class="bk-pad" aria-hidden="true"></span>';
  for(d=1;d<=days;d++){
    var dt=new Date(BK.y,BK.m,d), iso=bkIso(dt), on=BK.sel&&bkIso(BK.sel)===iso, past=dt<today, now=+dt===+today;
    h+='<button type="button" class="bk-day'+(on?' on':'')+(now?' today':'')+'" data-bk-day="'+iso+'" aria-pressed="'+(!!on)+'"'+(now?' aria-current="date"':'')+(past?' disabled':'')+
      ' aria-label="'+bkWd(dt)+' '+d+' '+BK_MONTHS[BK.m]+' '+BK.y+'">'+d+'</button>';
  }
  return h;
}
function bkSum(){
  var d=BK.sel; if(!d) return '';
  return '<div class="bk-date"><span>'+bkWd(d).slice(0,3)+'</span><b>'+d.getDate()+'</b></div>'+
    '<div class="bk-txt"><b>'+bkWd(d)+' '+d.getDate()+' '+BK_MONTHS[d.getMonth()]+'</b><span>'+(bkTz()?'Times shown in '+bkTz():'Times shown in your timezone')+'</span></div>';
}
function bkNavOff(){ var now=bkToday(), min=now.getFullYear()*12+now.getMonth(), idx=BK.y*12+BK.m; return {prev:idx<=min,next:idx>=min+BK.limit}; }
function bkRender(){
  var root=document.querySelector('[data-bk]'); if(!root) return;
  var off=bkNavOff();
  root.querySelector('[data-bk-title]').textContent=BK_MONTHS[BK.m]+' '+BK.y;
  root.querySelector('[data-bk-grid]').innerHTML=bkGrid();
  root.querySelector('[data-bk-sum]').innerHTML=bkSum();
  root.querySelector('[data-bk-nav="-1"]').disabled=off.prev;
  root.querySelector('[data-bk-nav="1"]').disabled=off.next;
  root.querySelector('[data-bk-tab]').setAttribute('href',bkUrl(BK.sel,false));
}
var BK_CHEV_L='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>';
var BK_CHEV_R='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
function bookSection(){
  bkInit();
  var off=bkNavOff();
  var week=['Mo','Tu','We','Th','Fr','Sa','Su'].map(function(x){ return '<span>'+x+'</span>'; }).join('');
  return sec('<div class="hero-grid split"><div class="hero-copy split-copy rv"><div class="label"><span>Book a time</span></div>'+
    '<h2 class="h2">Prefer to talk? Pick a slot</h2><p class="p">Choose a time on my calendar. Calendly confirms it by email.</p></div>'+
    '<div class="bcard rv" data-bk role="group" aria-label="Choose a day to book">'+
      '<div class="bk-head"><button type="button" class="bk-nav" data-bk-nav="-1" aria-label="Previous month"'+(off.prev?' disabled':'')+'>'+BK_CHEV_L+'</button><b class="bk-title" data-bk-title aria-live="polite">'+BK_MONTHS[BK.m]+' '+BK.y+'</b>'+
      '<button type="button" class="bk-nav" data-bk-nav="1" aria-label="Next month"'+(off.next?' disabled':'')+'>'+BK_CHEV_R+'</button></div>'+
      '<div class="bk-week" aria-hidden="true">'+week+'</div><div class="bk-grid" data-bk-grid>'+bkGrid()+'</div>'+
      '<div class="bk-sum" data-bk-sum>'+bkSum()+'</div>'+
      '<button type="button" class="bk-go" data-bk-open>See times <span aria-hidden="true">→</span></button>'+
      '<p class="bk-note">Scheduling by Calendly · <a data-bk-tab href="'+bkUrl(BK.sel,false)+'" target="_blank" rel="noopener">Open it in a new tab ↗</a></p>'+
    '</div></div>','book');
}
function bkClose(silent){
  var dlg=document.querySelector('dialog.bk-dlg'); if(!dlg) return;
  var op=BK.opener; BK.opener=null;
  try{ if(dlg.open&&typeof dlg.close==='function') dlg.close(); }catch(e){}
  dlg.remove(); document.body.classList.remove('cal-open');
  if(!silent&&op&&op.focus) op.focus();
}
function bkOpen(d,opener){
  bkClose(true);
  var dlg=document.createElement('dialog'); dlg.className='bk-dlg'; dlg.setAttribute('aria-label','Book a time with Anjor Tank');
  dlg.innerHTML='<div class="bk-dlg-head"><b>Book a time</b><span class="bk-dlg-date">'+(d?bkWd(d)+' '+d.getDate()+' '+BK_MONTHS[d.getMonth()]:'')+'</span><span class="sp"></span>'+
    '<a class="bk-dlg-tab" href="'+bkUrl(d,false)+'" target="_blank" rel="noopener">Open in a new tab ↗</a>'+
    '<button type="button" class="bk-x" data-bk-close aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'+
    '<div class="bk-dlg-body"><p class="bk-dlg-load" aria-hidden="true">Loading the calendar…</p><iframe class="bk-frame" title="Book a time with Anjor Tank on Calendly" src="'+bkUrl(d,true)+'"></iframe></div>';
  document.body.appendChild(dlg); BK.opener=opener||null; document.body.classList.add('cal-open');
  if(typeof dlg.showModal==='function') dlg.showModal(); else dlg.setAttribute('open','');
  dlg.addEventListener('close',function(){ if(dlg===document.querySelector('dialog.bk-dlg')) bkClose(); });     /* Esc, in browsers with real dialogs */
  dlg.addEventListener('click',function(e){ if(e.target===dlg) bkClose(); });                                     /* a click on the backdrop */
}
document.addEventListener('click',function(ev){
  var t=ev.target; if(!t.closest) return; var b;
  if((b=t.closest('[data-bk-day]'))){ if(b.disabled) return; var p=b.getAttribute('data-bk-day').split('-'); BK.sel=new Date(+p[0],+p[1]-1,+p[2]); bkRender(); var again=document.querySelector('[data-bk-day="'+b.getAttribute('data-bk-day')+'"]'); if(again) again.focus(); return; }
  if((b=t.closest('[data-bk-nav]'))&&!b.disabled){ var m=BK.m+(+b.getAttribute('data-bk-nav')); BK.y+=Math.floor(m/12); BK.m=((m%12)+12)%12; bkRender(); return; }
  if((b=t.closest('[data-bk-open]'))){ bkOpen(BK.sel,b); return; }
  if(t.closest('[data-bk-close]')){ bkClose(); }
});
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') bkClose(); });                              /* also covers browsers without native dialogs */
window.addEventListener('hashchange',function(){ bkClose(true); });

/* ================================================================
   ROUND 10 · the browser tab, history and bookmarks name the page, not only the site.
   Google reads the title after the page has rendered, so this is also what search results show.
   Set TAB_TITLES to false to go back to the brand-only tab title ("ANJOR TANK").
   ================================================================ */
var TAB_TITLES=true;
function pageTitle(key){
  if(!TAB_TITLES) return 'ANJOR TANK';
  if(key==='/') return 'Anjor Tank — GTM engineering for commerce';
  if(key==='404') return C.notfound.title;
  var name='', a, h;
  if(key==='project'){ h=document.querySelector('main h1'); name=h?(h.getAttribute('aria-label')||h.textContent).replace(/\s+/g,' ').trim():'Work'; }
  else { a=document.querySelector('[data-nav] [data-route="'+key+'"]'); name=a?a.textContent.trim():''; }
  return name?name+' — Anjor Tank':'Anjor Tank';
}

paletteInit();

shell();
syncThemeControls();
dialInit();
render();
})();

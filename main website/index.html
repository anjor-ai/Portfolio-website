@media(max-width:980px){.hero-grid,.case-grid{grid-template-columns:1fr}.hero-command{min-height:285px}.project-card,.project-card:first-child{grid-template-columns:1fr;grid-column:auto}.project-art{min-height:190px}.case-metrics{grid-template-columns:repeat(2,1fr)}.case-metric:nth-child(2){border-right:0}.case-metric:nth-child(-n+2){border-bottom:1px solid var(--border)}}
@media(max-width:680px){.hero-enhanced{padding:32px 0 38px}.hero-command{min-height:0}.hc-flow{grid-template-columns:1fr 1fr}.project-grid{grid-template-columns:1fr}.project-card,.project-card:first-child{padding:18px;min-height:0}.project-card h3{margin-top:22px}.pc-metrics{gap:14px}.project-art{min-height:170px}.case-hero{padding:34px 0 var(--s-6)}.case-grid{gap:24px}.case-metrics{grid-template-columns:1fr}.case-metric{border-right:0;border-bottom:1px solid var(--border)}.case-metric:last-child{border-bottom:0}.case-sec{grid-template-columns:1fr;gap:8px;padding:28px 0}.case-num{padding-top:0}.case-nav{grid-template-columns:1fr 1fr}.case-nav .all{grid-column:1/-1;grid-row:2;text-align:center}.case-nav a:last-child{text-align:right}}

/* ================================================================
   ADDITIONS — three components. Layout and behaviour only.
   No new colours (existing tokens only), no new fonts and no new
   font sizes (every size below already exists in this stylesheet).
   1 Command menu · 2 Experience timeline · 3 Loop run history
   ================================================================ */
kbd{font:500 12px/1 var(--f-body);display:inline-block;min-width:20px;padding:4px 6px;text-align:center;border-radius:6px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}

/* ---- 1 · Command menu ---- */
/* Reuses .theme-toggle for size, colour and hover. Shown only where the header has room for it;
   below this width the header is identical to before. The keyboard shortcut works at any width. */
.pal-trigger{cursor:pointer}
.pal-trigger svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1179px){.pal-trigger{display:none}}
dialog.pal{border:1px solid var(--border-strong);border-radius:var(--r-l);background:var(--frame);color:var(--text);padding:0;width:min(640px,92vw);margin:12vh auto auto;box-shadow:var(--shadow);overflow:hidden}
dialog.pal::backdrop{background:color-mix(in srgb,var(--void) 62%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 18px;height:56px;border-bottom:1px solid var(--border)}
.pal-in input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:var(--fs-body);color:var(--text)}
.pal-in input::placeholder{color:var(--text-3)}
.pal-list{max-height:min(52vh,420px);overflow:auto;padding:8px}
.pal-g{font-size:12px;color:var(--text-3);padding:12px 12px 6px}
.pal-it{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px;border-radius:var(--r-s);font-size:14.5px;color:var(--text-2);cursor:pointer}
.pal-it small{color:var(--text-3);font-size:12.5px;text-align:right}
.pal-it[aria-selected="true"]{background:var(--surface-2);color:var(--text)}
.pal-empty{padding:28px 12px;text-align:center;color:var(--text-3);font-size:var(--fs-14)}
.pal-foot{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 18px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-3)}
.pal-toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);padding:10px 16px;border-radius:var(--r-full);font-size:var(--fs-14);transition:opacity var(--t-base),transform var(--t-base);z-index:120}
.pal-toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- 2 · Experience timeline ---- */
/* Type is inherited from the existing .xp block: date 13.5, duration 12.5, role 20, org 14, points 14.5. */
.tl{container-type:inline-size}
.tl-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;font-size:var(--fs-20);color:var(--text-2)}
.tl-head b{color:var(--text);font-weight:500}
.tl-e{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s-7);padding:var(--s-7) 0;border-top:1px solid var(--hair)}
.tl-when{position:sticky;top:96px;align-self:start;font-size:13.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.tl-when i{display:block;font-style:normal;font-size:12.5px;color:var(--text-3);margin-top:2px}
.tl-when .chip-row{margin-top:10px}
.tl-body{position:relative;padding-left:var(--s-6);border-left:1px solid var(--border);min-width:0}
.tl-body::before{content:"";position:absolute;left:-4px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--frame);box-shadow:0 0 0 1px var(--border-strong)}
.tl-e.latest .tl-body::before{background:var(--violet);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-role{font-family:var(--f-head);font-size:20px;letter-spacing:-.015em;color:var(--text)}
.tl-org{font-size:14px;color:var(--text-2);margin-top:2px}
.tl-lead{font-size:var(--fs-body);line-height:1.55;color:var(--text);margin:16px 0 0;max-width:62ch}
.tl-list{list-style:none;margin:14px 0 0;padding:0;max-width:66ch}
.tl-list li{position:relative;padding:10px 0 10px 16px;border-top:1px solid var(--hair);font-size:14.5px;line-height:1.55;color:var(--text-2)}
.tl-list li::before{content:"";position:absolute;left:0;top:19px;width:6px;height:1.5px;background:var(--violet)}
.tl-areas{display:flex;gap:14px;align-items:baseline;margin-top:16px}
.tl-areas .k{font-size:12px;color:var(--text-3);flex:none}
@container (max-width:640px){
  .tl-e{grid-template-columns:1fr;gap:var(--s-4)}
  .tl-when{position:static;display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
  .tl-when i{display:inline;margin-top:0}
  .tl-when .chip-row{margin-top:0}
  .tl-body{padding-left:var(--s-5)}
  .tl-areas{flex-direction:column;gap:8px}
}

/* ---- 3 · Loop run history (layer 05 only) ---- */
/* Sits inside .rail-body: spans every column and bleeds to the frame edges (the rail-body padding is 24px at every width). */
.rail-body .runs{grid-column:1/-1;margin:0 -24px -28px;padding:22px 24px 8px;border-top:1px solid var(--border)}
.runs-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.runs-h .sp{flex:1}
.runs-h b{color:var(--text);font-weight:500;font-size:var(--fs-20);margin-right:12px}
.runs-h i{font-style:normal;font-size:13.5px;color:var(--text-3)}
.runs-l{list-style:none;margin:14px 0 0;padding:0}
.run{display:grid;grid-template-columns:160px minmax(0,1fr);gap:var(--s-5);padding:16px 0;border-top:1px solid var(--hair)}
.run-h{display:grid;gap:2px;align-content:start;font-size:13.5px;color:var(--text-3)}
.run-h b{color:var(--text);font-weight:500;font-size:14.5px}
.run-read{display:flex;flex-wrap:wrap;gap:6px}
.run-b p{margin:10px 0 0;font-size:14.5px;line-height:1.55;color:var(--text-2);max-width:64ch}
.run-b .run-carry{color:var(--text)}
.run-carry .k{display:inline-block;margin-right:10px;font-size:12px;color:var(--ok)}
.run.fresh{animation:runIn var(--t-slow) var(--e-out) both}
@keyframes runIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.runs-note{margin:6px 0 14px;font-size:12.5px;color:var(--text-3)}
.runs-note b{color:var(--warn);font-weight:500}
@media (max-width:760px){.run{grid-template-columns:1fr;gap:6px}.run-h{display:flex;gap:12px;align-items:baseline}}
@media (max-width:760px){.runs-h>span:first-child{flex:1 1 100%}.runs-h i{display:block;margin-top:2px}.runs-h .sp{display:none}}
@media (prefers-reduced-motion:reduce){.run.fresh{animation:none}}

/* ================================================================
   LIGHT-MODE COLOUR FIX
   Every rule below is prefixed html[data-theme="light"], so dark mode
   cannot be affected. Layout, sizes and fonts are untouched: colour only.
   Cause: dark-mode-only literals (a #15161B gradient, pastel status
   text, lifted violet and status green/amber used as text) that had no
   light counterpart. The four "ink" colours keep the hue of the status
   colour they replace and clear WCAG AA (4.5:1) on every light surface.
   #5B45E0 is the deep violet already used by .sb.c-deep.
   ================================================================ */
html[data-theme="light"]{--ok-ink:#1A7651;--warn-ink:#8A5F15;--stop-ink:#CE1500;--violet-ink:#5B45E0}

/* Simulators accordion: mirror the existing light override that .frame already has */
html[data-theme="light"] .acc{background:linear-gradient(180deg,#FFFFFF 0%,var(--frame) 30%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7)}
html[data-theme="light"] .acc-btn:hover{background:rgba(13,14,16,.04)}
html[data-theme="light"] .acc-inner>.frame{background:var(--frame);box-shadow:none}

/* Status green as text */
html[data-theme="light"] .chip.ok,
html[data-theme="light"] .tag.go,
html[data-theme="light"] .pl .pv .k,
html[data-theme="light"] .pc-status,
html[data-theme="light"] .run-carry .k{color:var(--ok-ink)}

/* Status amber as text */
html[data-theme="light"] .chip.warn,
html[data-theme="light"] .frame-note b,
html[data-theme="light"] .swarn b,
html[data-theme="light"] .st-sup b,
html[data-theme="light"] .st-guard b,
html[data-theme="light"] .ch2.none,
html[data-theme="light"] .runs-note b{color:var(--warn-ink)}

/* Status red as text */
html[data-theme="light"] .chip.stop,
html[data-theme="light"] .fld .err{color:var(--stop-ink)}

/* Lifted violet as small text (the large hero headline accent is intentionally left as it is) */
html[data-theme="light"] .acc-kicker,
html[data-theme="light"] .chip.vi,
html[data-theme="light"] .code .kw,
html[data-theme="light"] .tag.on,
html[data-theme="light"] .proc-rail button.done .dot,
html[data-theme="light"] .alias,
html[data-theme="light"] .clash-dl .rh,
html[data-theme="light"] .pc-open,
html[data-theme="light"] .case-kicker,
html[data-theme="light"] .case-nav .all{color:var(--violet-ink)}
/* the base rule uses !important, so this one has to as well */
html[data-theme="light"] .proc-loop{color:var(--violet-ink)!important}

/* "Against a typical stack" rows: pastel dark-mode text on a light tint */
html[data-theme="light"] .vs .minus,
html[data-theme="light"] .vs .plus{color:var(--text-2)}
html[data-theme="light"] .vs .minus span:first-child{color:var(--stop-ink)}
html[data-theme="light"] .vs .plus span:first-child{color:var(--ok-ink)}

/* ================================================================
   ADDITIONS FROM THE DESIGNER BRIEF — layout only.
   Existing tokens, classes and font sizes; no new colours or fonts.
   ================================================================ */
/* Experience: the four domains the career spans */
.tl-domains{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-5);padding-bottom:var(--s-7)}
.tl-domains>div{border-top:1px solid var(--border-strong);padding-top:14px}
.tl-domains p{margin:6px 0 0;font-size:14px;line-height:1.5;color:var(--text-2)}
@media (max-width:980px){.tl-domains{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tl-domains{grid-template-columns:1fr;gap:var(--s-4)}}

/* Areas / Team / Proof rows: a shared label width so their tags start on one line */
.tl-areas .k{min-width:36px}

/* ================================================================
   ROUND 3 — mobile header, scroll rails, GTM scroll rows, new sections
   Existing tokens, classes and font sizes only: no new colours or fonts.
   ================================================================ */

/* ---- Mobile header: the theme switch and the menu stay in the sticky header ---- */
@media (max-width:760px){
  .theme-header{display:inline-flex;width:36px;height:36px;flex:0 0 auto}
  .burger{display:inline-flex!important;width:36px;height:36px;margin-left:0;flex:0 0 auto}
  .menu-open .sheet{display:block!important}
  body.menu-open .dial,body.menu-open .dial-hint{display:none}
  .hdr-m{flex:0 0 auto}
}
@media (max-width:430px){ .hdr-in{padding-inline:16px} }
@media (max-width:392px){ .hdr-in{gap:6px} .hdr-m{padding:0 10px} .theme-header,.burger{width:34px;height:34px} }
@media (max-width:339px){ .hdr-m{display:none} }   /* the CTA stays in the menu and on every page */

/* ---- Tab rails on small screens: aligned, snapped, and no scrollbars ---- */
@media (max-width:760px){
  .rail{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(124px,1fr);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
  .rail::-webkit-scrollbar{display:none}
  .rail button{scroll-snap-align:start}
  .rail button::after{bottom:0}
  .proc-rail{overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
  .proc-rail::-webkit-scrollbar{display:none}
}
@media (max-width:575px){
  .proc-rail{--pw:552px;grid-template-columns:repeat(6,92px)}
  .proc-rail::before{left:54px;right:auto;width:460px}
  .proc-rail .fill{left:54px}
}

/* ---- GTM: long card lists become swipeable rows on small screens ---- */
@media (max-width:760px){
  .hs{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:84%;gap:var(--s-5);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain}
  .hs::-webkit-scrollbar{display:none}
  .hs>*{scroll-snap-align:start;min-width:0}
  .hs.chain{grid-auto-columns:78%}
  .hs.chain>div{border-right:1px solid var(--border);border-bottom:0}
  .hs.chain>div:last-child{border-right:0}
  .hs-layers .layer{padding:var(--s-4) 0 0;border-top:1px solid var(--hair)}
  .hs-layers .layer:first-child{border-top:1px solid var(--hair);padding-top:var(--s-4)}
}

/* ---- GTM: architecture and mechanism cards inside the existing track ---- */
.ecard .k{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
.ecard .ec-foot{margin-top:auto;padding-top:16px}
.ecard .ec-main{padding-bottom:14px}
.ecard .ec-sub{margin-top:auto;padding-top:12px;border-top:1px solid var(--hair)}
.ecard .ec-sub p{font-size:14.5px}
.mech-note{margin:var(--s-4) 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:13.5px;color:var(--text-2)}

/* ---- Work: the "also shipped" ledger ---- */
.ledger ul{margin:0}
.ledger li:first-child{margin-top:0}
.ledger .when{padding-top:1px}

.strip-pad{padding:16px}

/* very narrow phones: the secondary caption in these two bars is dropped so the title never wraps */
@media (max-width:349px){ .fb-r{display:none} }

/* the numbered checks in the symptom router use the secondary text token */
.dlog-det .sinv b{color:var(--text-2)}

/* ================================================================
   ROUND 4 — MOTION LAYER (effects 09–14 of the motion library)
   Applied on top of the existing site: no typography, colour or layout
   values are changed. Overlays are absolutely positioned, aria-hidden and
   sit behind content; transient wrappers are removed when they finish.
   Nothing here runs under prefers-reduced-motion (the JS never starts it
   and the global rule below freezes any CSS animation).
   ================================================================ */
:root{--fx-ease:cubic-bezier(.22,.85,.3,1);--fx-spring:cubic-bezier(.34,1.4,.64,1)}

/* ---- Typewriter: the full phrase is laid out from the start (invisible), so typing never reflows the page ---- */
.h1 .tw-r{color:transparent}
.h1[data-kw] .caret{visibility:hidden}
.h1.tw-on .caret{visibility:visible}

/* ---- 14 · Kinetic reveal: word-by-word line wipe (wrappers exist only while animating) ---- */
.kw-w{display:inline-block;vertical-align:top;overflow:hidden;padding:.06em .06em .16em 0;margin:-.06em -.06em -.16em 0}
.kw-i{display:inline-block;transform:translateY(118%);transition:transform .85s var(--fx-spring);transition-delay:calc(var(--i,0) * 45ms)}
.kw-go .kw-i{transform:none}
.rv[data-kw]{opacity:1;transform:none;transition:none}

/* ---- 14 · chip pop ---- */
.fx-pop{opacity:0;transform:scale(.5)}
.fx-pop.fx-in{opacity:1;transform:none;transition:transform .7s var(--fx-spring),opacity .5s var(--fx-ease);transition-delay:var(--pd,0s)}

/* ---- 09 · Static noise (live grain on a small canvas, drawn only while visible) ---- */
.fx-grain{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;image-rendering:pixelated;opacity:.15}
.close .blk{isolation:isolate}
.close .blk .fx-grain{opacity:.13}

/* ---- 13 · Retro readout on the hero consoles: scanlines drift, edges fall off, rows write in ---- */
.hero-command::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;box-shadow:inset 0 0 70px 8px rgba(0,0,0,.26)}
/* the scanlines drift by moving a taller layer with a transform (compositor only). Animating background-position repainted the whole console every frame. */
.fx-scan{position:absolute;left:0;right:0;top:-120px;bottom:0;z-index:-1;pointer-events:none;will-change:transform;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0,rgba(255,255,255,.045) 1px,transparent 1px,transparent 3px);
  animation:fxScan 9s linear infinite;animation-play-state:paused}
.hero-command.fx-on .fx-scan{animation-play-state:running}
@keyframes fxScan{to{transform:translateY(120px)}}
[data-retro] .fx-line{opacity:0;transform:translateY(6px);transition:opacity .5s var(--fx-ease),transform .5s var(--fx-ease);transition-delay:var(--rd,0s)}
[data-retro].in .fx-line{opacity:1;transform:none}

/* ---- 10 · Liquid cells behind the closing call-to-action (desktop only). Soft discs moved by transform: the SVG goo filter cost up to 1s a frame. ---- */
.fx-liquid{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.24}
.fx-liquid i{position:absolute;display:block;border-radius:50%;animation-timing-function:var(--fx-ease);animation-iteration-count:2;animation-direction:alternate;animation-play-state:paused;will-change:transform}
.close .blk.fx-on .fx-liquid i{animation-play-state:running}
.fx-liquid .l1{left:8%;top:14%;width:230px;height:230px;background:radial-gradient(circle,var(--violet) 0,transparent 68%);animation-name:fxDrift1;animation-duration:9s}
.fx-liquid .l2{left:52%;top:4%;width:170px;height:170px;background:radial-gradient(circle,var(--violet-lift) 0,transparent 68%);animation-name:fxDrift2;animation-duration:11s}
.fx-liquid .l3{left:64%;top:40%;width:270px;height:270px;background:radial-gradient(circle,#5B45E0 0,transparent 68%);animation-name:fxDrift3;animation-duration:13s}
.fx-liquid .l4{left:26%;top:52%;width:130px;height:130px;background:radial-gradient(circle,var(--violet-lift) 0,transparent 68%);animation-name:fxDrift1;animation-duration:8s;animation-delay:-2s}
.fx-liquid .l5{left:4%;top:58%;width:180px;height:180px;background:radial-gradient(circle,var(--violet) 0,transparent 68%);animation-name:fxDrift2;animation-duration:14s;animation-delay:-4s}
.fx-liquid .l6{left:76%;top:8%;width:120px;height:120px;background:radial-gradient(circle,var(--void) 0,transparent 68%);opacity:.5;animation-name:fxDrift3;animation-duration:10s;animation-delay:-1s}
@keyframes fxDrift1{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,-35px) scale(1.15)}}
@keyframes fxDrift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-60px,40px) scale(.9)}}
@keyframes fxDrift3{from{transform:translate(0,0) scale(1)}to{transform:translate(35px,55px) scale(1.08)}}
@media (max-width:760px){ .fx-liquid{display:none} }

/* ---- 12 · Collapsing grid: groups of chips and cells scatter in, then settle ---- */
[data-collapse]>*{opacity:.12;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);transition:transform .8s var(--fx-ease),opacity .6s var(--fx-ease);transition-delay:var(--d)}
[data-collapse].fx-in>*{opacity:1;transform:none}


/* ================================================================
   ROUND 4 — two components from the motion library screenshots
   Barcode goal tracker (GTM)
   Site tokens and font sizes only; dark-card colours are the literals the
   hero consoles already use, so they read the same in light and dark themes.
   ================================================================ */

/* ---- barcode goal tracker ---- */
.goal{max-width:440px;background:#111216;border:1px solid rgba(235,231,226,.12);border-radius:var(--r-l);padding:clamp(20px,3vw,28px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:#EBE7E2}
.goal-tags{display:flex;flex-wrap:wrap;gap:8px}
.goal-tags span{font-size:12px;padding:3px 10px;border-radius:var(--r-full);border:1px solid rgba(235,231,226,.18);color:#8A8D99}
.goal-title{margin:20px 0 0;font-size:var(--fs-20);line-height:1.25;letter-spacing:-.01em;color:#EBE7E2}
.goal-sub{margin:14px 0 0;padding-top:14px;border-top:1px solid rgba(235,231,226,.10);font-size:var(--fs-14);color:#8A8D99}
.goal-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:18px}
.goal-num{font-family:var(--f-head);font-size:var(--fs-h2);font-weight:500;letter-spacing:-.03em;line-height:1;color:#EBE7E2}
.goal-chip{font-size:12px;padding:3px 10px;border-radius:var(--r-full);color:#3ED598;background:rgba(62,213,152,.10);border:1px solid rgba(62,213,152,.30)}
.goal-since{font-size:12px;color:#8A8D99}
.goal-bar{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px;height:34px;margin-top:22px}
.goal-bar i{display:block;border-radius:2px;background:#2A2B31}
.goal-bar i.on{background:#EBE7E2}
[data-goal-arm] .goal-bar i{opacity:.25;transform:scaleY(.2);transform-origin:bottom;transition:opacity .4s var(--fx-ease),transform .5s var(--fx-spring);transition-delay:calc(var(--k) * 26ms + 200ms)}
[data-goal-arm].fx-in .goal-bar i{opacity:1;transform:none}
[data-goal-arm] .goal-chip{opacity:0;transform:scale(.5)}
[data-goal-arm].fx-in .goal-chip{opacity:1;transform:none;transition:transform .7s var(--fx-spring),opacity .5s var(--fx-ease);transition-delay:1s}
@media (max-width:560px){ .goal{max-width:none} }

/* ================================================================
   ROUND 5 — GTM: "Measure" in two columns (the hero's own grid) and a richer "Where it applies".
   Existing tokens, classes and font sizes only.
   ================================================================ */
/* Measure: the hero's two-column grid; copy on the left, the tracker on the right */
.split-copy .label{margin-bottom:var(--s-4)}
.split-copy .h2{margin:0}
.split-copy .p{margin:var(--s-4) 0 0}
.split-copy .mech-note{margin-top:var(--s-5)}
.hero-grid .goal{max-width:none}

/* Where it applies: one card per business type, plus an invitation card */
.ap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-4)}
.ap-card,.ap-cta{min-height:230px}
.ap-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ap-top .n{color:var(--text-2)}
.ap-card h3,.ap-cta h3{margin:14px 0 6px}
.ap-card p,.ap-cta p{margin:0;font-size:14.5px;line-height:1.5}
.ap-card p{min-height:3em}                 /* every description reserves two lines, so the "reads" labels line up across a row */
.ap-card .ec-foot{margin-top:16px;padding-top:0}
a.ap-cta{transition:transform var(--t-base)}
a.ap-cta:hover{transform:translateY(-2px)}
.ap-cta .dur b{font-size:20px}
@media (max-width:1020px){ .ap-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .ap-grid.hs{grid-template-columns:none;grid-auto-columns:84%} .ap-card,.ap-cta{min-height:0} }

/* ================================================================
   ROUND 6 — Contact: form states and the Calendly embed. Existing tokens only.
   ================================================================ */
.form-err{grid-column:1/-1;padding:12px 14px;border:1px solid rgba(255,107,90,.35);background:rgba(255,107,90,.06);border-radius:var(--r-s);font-size:14.5px;line-height:1.5;color:var(--text)}
.form-err[hidden]{display:none}
.form[hidden]{display:none}      /* .form is display:grid, which otherwise beats the hidden attribute and left the form showing after a send */
.form-err b{color:var(--stop);font-weight:500}
html[data-theme="light"] .form-err b{color:var(--stop-ink)}
.form-err a{border-bottom:1px solid var(--border-strong)}
.lnk{background:none;border:0;border-bottom:1px solid var(--border-strong);padding:0;font:inherit;color:inherit;cursor:pointer}
.form button[disabled]{opacity:.6;cursor:progress}

/* ================================================================
   ROUND 8 — Contact: "Who you'd work with" as a profile card.
   The card is always dark, like the site's other dark cards, so it uses the same literals.
   ================================================================ */
.pcard{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);background:#111216;border:1px solid rgba(235,231,226,.12);border-radius:var(--r-l);overflow:hidden;color:#EBE7E2;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.pcard-photo{position:relative;min-height:100%}
.pcard-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.pcard-body{padding:clamp(24px,4vw,48px)}
.pcard .label{color:#8A8D99;margin-bottom:16px}
.pcard .h2{color:#EBE7E2}
.pcard .p{color:#8A8D99;margin-top:var(--s-4)}
.pcard .h2+.p{margin-top:var(--s-5)}
.pcard-cta{margin-top:var(--s-6)}
.pcard-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border:1px solid rgba(235,231,226,.35);border-radius:var(--r-full);color:#EBE7E2;font-size:15px;transition:border-color var(--t-fast),background var(--t-fast)}
.pcard-btn:hover{border-color:var(--violet);background:rgba(117,96,255,.14)}
.pcard-btn svg{width:18px;height:18px;flex:none}
/* the facts sit inside the card: label above value, two columns */
.pcard .facts{margin-top:var(--s-6);padding-top:var(--s-5);border-top:1px solid rgba(235,231,226,.10);grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-4) var(--s-6)}
.pcard .facts div{display:block;padding:0;border-top:0;font-size:14.5px;color:#EBE7E2}
.pcard .facts div span:first-child{display:block;color:#8A8D99;font-size:13px;margin-bottom:2px}
.pcard .facts a{color:#EBE7E2;border-bottom:1px solid rgba(235,231,226,.35)}
.pcard .facts a:hover{border-color:var(--violet)}
@media (max-width:760px){
  .pcard{grid-template-columns:1fr}
  .pcard-photo{min-height:0;height:min(68vw,340px)}
  .pcard-photo img{object-position:50% 6%}
  .pcard .facts{grid-template-columns:1fr}
}

/* ================================================================
   ROUND 9 — Contact: the compact booking card and its pop-up.
   Always dark, like the site's other dark cards, so it uses the same literals.
   ================================================================ */
.bcard{width:100%;max-width:380px;justify-self:center;background:#111216;border:1px solid rgba(235,231,226,.12);border-radius:var(--r-l);padding:20px;color:#EBE7E2;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.bk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.bk-title{font-family:var(--f-head);font-size:var(--fs-18);font-weight:500;letter-spacing:-.01em}
.bk-nav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#8A8D99;background:transparent;border:0;cursor:pointer;transition:background var(--t-fast),color var(--t-fast)}
.bk-nav:hover:not(:disabled){background:rgba(235,231,226,.08);color:#EBE7E2}
.bk-nav:disabled{opacity:.3;cursor:default}
.bk-week,.bk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bk-week{margin-bottom:8px}
.bk-week span{text-align:center;font-size:12px;color:#8A8D99}
.bk-day{aspect-ratio:1;border-radius:9px;border:1px solid transparent;background:rgba(235,231,226,.06);color:#EBE7E2;font-size:14px;cursor:pointer;transition:background var(--t-fast)}
.bk-day:hover:not(:disabled){background:rgba(235,231,226,.14)}
.bk-day:disabled{background:transparent;color:#5E6068;cursor:default}
.bk-day.today{border-color:rgba(235,231,226,.55)}
.bk-day.on{background:#5B45E0;border-color:#5B45E0;color:#fff}
.bk-day:focus-visible,.bk-nav:focus-visible,.bk-go:focus-visible,.bk-x:focus-visible{outline:2px solid #8F7DFF;outline-offset:2px}
.bk-sum{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(235,231,226,.10)}
.bk-date{flex:none;width:62px;padding:8px 0 9px;border-radius:12px;text-align:center;background:linear-gradient(180deg,#0D0E10 22%,rgba(91,69,224,.8) 100%);border:1px solid rgba(235,231,226,.10)}
.bk-date span{display:block;font-size:12px;color:#EBE7E2;opacity:.8}
.bk-date b{display:block;font-family:var(--f-head);font-size:var(--fs-h3);font-weight:500;line-height:1.1;color:#EBE7E2}
.bk-txt b{display:block;font-weight:500;font-size:15px;color:#EBE7E2}
.bk-txt span{display:block;margin-top:2px;font-size:12.5px;color:#8A8D99}
.bk-go{margin-top:16px;width:100%;padding:12px 16px;border-radius:var(--r-full);background:#EBE7E2;color:#0D0E10;font-size:15px;font-weight:500;border:0;cursor:pointer;transition:opacity var(--t-fast)}
.bk-go:hover{opacity:.9}
.bk-note{margin:12px 0 0;text-align:center;font-size:12.5px;color:#8A8D99}
.bk-note a{color:#EBE7E2;border-bottom:1px solid rgba(235,231,226,.35)}
/* the pop-up that holds Calendly */
body.cal-open{overflow:hidden}
.bk-dlg{padding:0;border:1px solid rgba(235,231,226,.14);border-radius:var(--r-l);background:#111216;color:#EBE7E2;max-width:none;max-height:none;overflow:hidden;
  width:min(760px,calc(100vw - 32px));height:min(780px,calc(100vh - 48px));height:min(780px,calc(100dvh - 48px))}
.bk-dlg[open]{display:flex;flex-direction:column}
.bk-dlg::backdrop{background:rgba(13,14,16,.62)}
.bk-dlg-head{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-bottom:1px solid rgba(235,231,226,.10);font-size:14.5px}
.bk-dlg-head b{font-family:var(--f-head);font-weight:500;font-size:var(--fs-16)}
.bk-dlg-date{color:#8A8D99}
.bk-dlg-tab{color:#EBE7E2;font-size:13px;border-bottom:1px solid rgba(235,231,226,.35)}
.bk-x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#EBE7E2;background:transparent;border:0;cursor:pointer}
.bk-x:hover{background:rgba(235,231,226,.10)}
.bk-dlg-body{position:relative;flex:1;min-height:0}
.bk-frame{position:relative;z-index:1;display:block;width:100%;height:100%;border:0}
.bk-dlg-load{position:absolute;inset:0;margin:0;display:grid;place-items:center;font-size:14px;color:#8A8D99}
@media (max-width:560px){
  .bk-dlg{width:100vw;max-width:100vw;height:100vh;height:100dvh;max-height:none;margin:0;border-radius:0;border-width:0}
  .bk-dlg-date{display:none}
}

/* ================================================================
   ROUND 11 — phone text fixes. Text no longer spills out of, or breaks awkwardly inside, its box.
   Phones only (max-width 760px); desktop and tablet are untouched. Existing tokens only.
   ================================================================ */
@media (max-width:760px){
  /* frame bars grow with their text instead of spilling out of a fixed 44px bar; titles keep their size, notes drop to 14px */
  .frame-bar{height:auto;min-height:44px;flex-wrap:wrap;column-gap:12px;row-gap:2px;padding:10px 16px;font-size:var(--fs-14);line-height:1.4;overflow-wrap:anywhere}
  .frame-bar b{font-size:var(--fs-20);white-space:nowrap}
  .frame-bar .sp{flex:1 0 8px}
  /* the label row above section headings: pills and labels stay whole, and the pill drops below if the row is full */
  .sh .label{flex-wrap:wrap;row-gap:8px}
  .pill{white-space:nowrap;font-size:var(--fs-14);padding:0 10px}
  /* "2–3 weeks" stays whole */
  .ecard .dur b{white-space:nowrap}
  /* tables inside horizontal scrollers: columns wide enough to read, and headings never split at a hyphen */
  .scroll-x .tbl th{white-space:nowrap}
  .scroll-x .tbl td{min-width:150px}
  /* previous / next links keep the arrow with the last word */
  .case-nav a{text-wrap:balance}
  /* addresses wrap instead of being clipped */
  .facts a,a[href^="mailto:"]{overflow-wrap:anywhere}
}

 /* ---------------- SIMULATORS (tools ported from project prototypes) ---------------- */
 sim:{
  title:'Simulators — Anjor Tank',
  label:'Simulators',
  h1:'Find your leak before you pay to fix it', h1v:'pay to fix it',
  lead:'Two tools, no sign-up. The diagnostic ranks your funnel’s leaks by recoverable volume. The decision trace runs one customer event through a real rule set.',
  funnel:{ label:'Funnel diagnostic', h:'Find the leak that’s actually worth fixing', meta:'~2 min · your numbers',
   p:'The steepest percentage drop is rarely the biggest opportunity — volume at the step matters as much as the gap. Enter your numbers and every leak gets ranked by recoverable volume.' },
  trace:{ label:'Decision trace', h:'Run a customer event through the rules', meta:'6 rules · 1 event',
   p:'Pick the event that fired, toggle what the engine knows about the customer, and watch which rule wins — and which ones it overrides.' },
  method:{ label:'Methodology', h:'How the numbers behind these tools work', meta:'Read · 2 min',
   p:'What each calculation does, and doesn’t, assume — so you can trust the output enough to act on it, or challenge it.',
   body:[
    'The <b>funnel diagnostic</b> doesn’t just find the steepest drop — it multiplies each step’s conversion gap by the volume still flowing through it, so a smaller gap earlier in the funnel can outrank a bigger one further down. Closing a gap only ever propagates forward through the steps below it, never backward.',
    'The <b>decision trace</b> evaluates every rule that matches the event and context you set, then executes the single highest-priority one. Every other match is logged as overridden, not silently dropped — that ledger is the point: most stacks fire every matching rule at once with no precedence at all.'
   ],
   faq:[
    ['Is my data stored anywhere?','No. Both tools run entirely in your browser. Nothing you type is sent anywhere, logged, or kept when you close the tab.'],
    ['Where do the reference benchmarks come from?','They’re directional starting points for a typical consumer funnel, not industry averages or a specific client’s figures — they exist to locate your weakest step, not to grade you against a peer set.'],
    ['Can this replace an actual audit?','No — it’s a rough triage. A real audit checks the data source, segments by cohort, and validates the leak before anyone spends engineering time on it.']
   ]}
 },

{id:'checkout',code:'PRJ / 01',cat:'payments',status:'shipped',
 title:'Checkout &amp; payments infrastructure',role:'enterprise commerce partner \u00b7 Enterprise commerce transformation',
 summary:'Redesigned checkout end to end and launched Price Lock, lifting prepaid conversion while cutting cancellations and RTO.',
 cardMetrics:[['89.7%','Prepaid conversion'],['+6.0pp','Payment adoption'],['+3.0%','Fulfilment']],
 lead:'When scale breaks a product it rarely breaks at the UI layer \u2014 it breaks in the backend systems underneath. Checkout was where that showed up most.',
 metrics:[['77.2 \u2192 89.7%','Prepaid order-to-delivery conversion'],['\u22121.9pp','RTO'],['\u22123.3pp','Cancellations'],['+3.0%','Delivery fulfilment']],
 hook:'Customers placed an order, selected online payment, and then waited hours for a payment link that may never come \u2014 or got cancelled without warning if their courier couldn\u2019t handle cash on delivery.',
 context:['There was no standard e-commerce checkout experience. Payment wasn\u2019t collected at order placement \u2014 the system held the order until the box was packed at the warehouse, three to four hours later, and only then sent the customer a payment link.',
   'Miss that window and the order sat a full day before shipping; if the courier couldn\u2019t handle COD, it auto-cancelled. The problem was known across the team \u2014 I was first to take ownership, with designers, engineers and a data analyst on it from day one.'],
 problem:['The root cause had three layers: a broken payment flow, courier-driven auto-cancellations, and warehouse price mismatches that made collecting payment at checkout technically unreliable. The price mismatches alone had five distinct causes:',
   '<ul><li><b>JIT procurement</b> \u2014 out-of-stock items procured just-in-time at a different price than shown at placement</li><li><b>Batch change</b> \u2014 a medicine batch change between order and fulfilment changed the applied price</li><li><b>Pricing error</b> \u2014 incorrect prices in the system, corrected only when the box was packed</li><li><b>Pack size substitution</b> \u2014 a pack of 10 replaced with 2\u00d75, same quantity, different unit pricing</li><li><b>SKU substitution</b> \u2014 the nearest equivalent item swapped in, different SKU and price</li></ul>',
   'Order cancellations from missed payments, auto-cancellations from COD-ineligible couriers, and price-mismatch complaints were the data signals.'],
 hard:['Everyone agreed on the direction. The hard part was building the operational systems to make it work without creating a cost problem for the business.',
   'Every one of the five price-mismatch causes needed its own portal-level fix, tracking the substitution or correction so the customer-facing price never moved \u2014 which meant enumerating every scenario that could change a price at the warehouse and mitigating each one.',
   'Separately, the warehouse had no software to suggest a next-best SKU on a stockout \u2014 floor leads cross-referenced a static spreadsheet, and because the portal only supported delete-and-re-add rather than a true replacement, substitutions silently changed the customer\u2019s bill.'],
 decision:['<b>The key call: lock the price at order placement, and intercept substitutions at the warehouse portal rather than pushing the decision to the customer.</b>',
   'Preventing every price change at the source was operationally complex and months away, so the decision was to lock the customer\u2019s price at order placement instead: any increase is absorbed as a discount, any decrease refunded, and the payable amount never moves from what they agreed to.',
   'For stockouts, I chose to shield the customer from the friction entirely rather than surface substitution choices on the frontend \u2014 a mid-checkout toggle as prices shifted would have driven drop-off, even though stakeholders argued it would protect margins. The system absorbs the variance internally instead.',
   '<b>What I chose not to do:</b> fix every upstream pricing and inventory system first. That would have delayed a fix customers needed immediately, so I kept the engineering footprint localised to the checkout and warehouse portals rather than building consumer-facing configuration paths.',
   'Validated on two tracks: floor testing with warehouse ops for the portal changes, and a parity benchmark against standard e-commerce checkout flows for the consumer-facing redesign.'],
 built:['<b>Price Lock.</b> Freezes the customer\u2019s price at order placement. Every warehouse-side change \u2014 JIT procurement, batch change, pack substitution, SKU swap \u2014 is tracked through the order-processing portals, the delta applied as a discount or refund rather than passed on.',
   '<b>Checkout redesign.</b> Moved payment collection to order placement, matching standard e-commerce, redesigned the payment UI to surface options clearly and handle failures without triggering a cancellation, and removed the three-to-four-hour window causing missed payments.',
   '<b>Algorithmic SKU substitution engine.</b> An automated tagging layer in the Catalog Management System reads salt composition, product line, dosage format and mother brand to suggest verified substitute SKUs, which lock in and train future suggestions once accepted. Before reaching a picker, every order now passes a live-inventory check \u2014 stockouts route to a portal pre-populated with the best substitute, replacing the old delete-and-re-add flow with a native one-to-one swap and a mandatory reason code for a clean audit trail.'],
 outcomeNarrative:['Prepaid order-to-delivery conversion moved from 77.2% to 89.7% \u2014 up 12.5 percentage points \u2014 with RTO down 1.9pp and cancellations down 3.3pp across Price Lock and the substitution engine. Payment visibility lifted prepaid adoption 6.0pp, and the substitution engine lifted delivery fulfilment 3.0%.',
   'Support queries about payment activation and order status dropped sharply, and the project became the company\u2019s first standard e-commerce payments stack \u2014 the base the wider payments revamp was built on.'],
 retro:['I jumped straight into building the ideal checkout experience without first auditing the payments stack technically \u2014 which partners were available, what discount structures could incentivise online payment, which UX issues needed fixing independently. That audit first would have made the build more targeted and the payments revamp cleaner.',
   'On the substitution engine, I shipped it live across every fulfilment centre at once rather than one low-volume warehouse first \u2014 the multi-warehouse scale exposed database gaps I hadn\u2019t seen, forcing a rollback and incremental redeploy. A shadow pilot on a plain spreadsheet for a week would have surfaced the same gaps far cheaper.'],
 stack:['Checkout UX','Payments infrastructure','Catalog & inventory systems','A/B testing','System architecture'],
 diagram:'checkout'},

   'On the coupon platform, I took direct ownership \u2014 partnering with marketing on the promotional constructs the business needed, and with design to rebuild the UI across admin, app and web.'],
 problem:['The referral programme was leaking to fraud \u2014 the same device IDs claiming repeat rewards, and return-order abuse undermining the unit economics of every referral.',
   'The coupon system couldn\u2019t isolate customer cohorts, so every targeted campaign meant an engineer hardcoding it on the backend. With no expiry-alert system, top-performing coupons quietly lapsed on busy days, costing three to four days of orders before anyone noticed \u2014 and on the consumer side, nobody could see which coupon applied to which item or what they\u2019d save before checkout.',
   'Meanwhile repeat-order drop-off sat there as an unaddressed revenue leak, and every growth campaign still needed an engineering ticket just to ship a landing page.'],
 hard:['Everyone agreed the coupon platform needed rebuilding \u2014 the hard part was expanding the rule validator to handle 45+ stacking and exclusion combinations without spiking checkout API latency or blocking real-time cart updates.',
   'That meant a granular classification system: generic versus branded, OTC versus non-OTC, prescription-required versus general wellness, plus SKU-specific whitelists marketing could bulk-upload. Marketing tracked promotional burn rate day-on-day, keeping engineering and growth aligned instead of clashing over margin.'],
 decision:['<b>The key call: rebuild the coupon platform from scratch rather than patch the legacy backend.</b>',
   'The infrastructure had to be built cleanly once to support scale, with micro-optimisation scheduled for later rather than trimming the feature set to hit an earlier date.',
   '<b>What I chose not to do:</b> ship a reduced scope to hit a nearer-term deadline. Where the timeline threatened to stretch too far, I worked backward from the business goal to break the build into milestones that covered the immediate operational need without compromising the architecture.'],

   'I deployed a <b>Strapi headless CMS</b> so growth could ship real-time page builds without an engineering dependency, and rebuilt the coupon platform into a 45+ combination rule-stacking engine with cashback tracked live across cart, order-summary and order-status. Wallet payouts locked to post-delivery only, capped at \u20b9100 or 10% of order value, to close off refund fraud.',
   'And I built a <b>full-stack order reminder platform</b> \u2014 refill-window scoring feeding customer reminder journeys, internal agent workflows and retention communications.'],
 outcomeNarrative:['Referral acquisition contribution doubled from 6% to 13%. The headless CMS lifted landing page conversion 1.7pp through continuous A/B testing. The reminder platform now drives roughly 1,100 repeat orders a day.',
   'The coupon rebuild improved retention 1.9pp and coupon applicability 5.0pp, lifted conversion to order placement 2.6%, and support tickets about unapplied coupons or unclear cashback timing dropped sharply in the first week.'],

/* Two-tone hero headline: o.h1 is the full plain title; when o.h1v names a
   trailing phrase of it (an exact suffix), that phrase renders in the violet
   accent. The accent phrase types itself out letter by letter with a blinking caret on every
   hero, replaying on each visit since the element is rebuilt fresh on each render().
   The whole phrase is laid out (transparent) from the first frame, so typing never
   reflows the page. prefers-reduced-motion shows the full phrase immediately
   (the global reduced-motion rule also freezes the caret's blink). */
function heroTitle(o, animate){
  var full=o.h1, tail=o.h1v, i=tail?full.lastIndexOf(tail):-1;
  if(i<0) return '<h1 class="h1 rv d2">'+full+'</h1>';
  var head=full.slice(0,i), accent=full.slice(i);
  if(!animate) return '<h1 class="h1 rv d2">'+head+'<span class="accent">'+accent+'</span></h1>';
  return '<h1 class="h1 rv d2" data-typeh1 aria-label="'+esc(full)+'">'+head+'<span class="accent" data-typetext="'+esc(accent)+'"><span class="tw-t"></span><span class="caret" data-caret></span><span class="tw-r">'+accent+'</span></span></h1>';
}

var ARW=function(d){return '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="'+(d<0?'M15 5l-7 7 7 7':'M9 5l7 7-7 7')+'"/></svg>';};
function track(o){
  return '<div data-trkw><div class="wrap">'+(o.above||'')+
    '<div class="trk-bar"><span class="cnt" data-trk-count aria-live="polite"><b>1</b> of '+o.n+'</span>'+
    '<button type="button" class="trk-btn" data-trk="-1" aria-label="Previous" disabled>'+ARW(-1)+'</button>'+
    '<button type="button" class="trk-btn" data-trk="1" aria-label="Next"'+(o.n>1?'':' disabled')+'>'+ARW(1)+'</button></div></div>'+
    '<div class="trk" tabindex="0" role="region" aria-label="'+o.label+', scroll horizontally" data-trk-track>'+o.cards+'</div>'+
    '<div class="wrap"><div class="trk-prog" aria-hidden="true"><i data-trk-prog></i></div>'+(o.below||'')+'</div></div>';
}
function trkCards(t){ return [].slice.call(t.children).filter(function(c){return !c.hidden&&c.nodeType===1;}); }
function trkSync(w){
  if(!w){ $main.querySelectorAll('[data-trkw]').forEach(trkSync); return; }
  var t=w.querySelector('[data-trk-track]'), cards=trkCards(t), n=cards.length, max=t.scrollWidth-t.clientWidth, idx=0;
  var snap=t.getBoundingClientRect().left+parseFloat(getComputedStyle(t).scrollPaddingLeft||0), best=Infinity;
  cards.forEach(function(c,i){ var d=Math.abs(c.getBoundingClientRect().left-snap); if(d<best){ best=d; idx=i; } });
  if(max>0&&t.scrollLeft>=max-2) idx=n-1;
  w.querySelector('[data-trk-count]').innerHTML='<b>'+(n?idx+1:0)+'</b> of '+n;
  w.querySelector('[data-trk-prog]').style.width=(n?((idx+1)/n*100):0)+'%';
  w.querySelector('[data-trk="-1"]').disabled=t.scrollLeft<=2;
  w.querySelector('[data-trk="1"]').disabled=max<=2||t.scrollLeft>=max-2;
  var cur=cards[idx]&&cards[idx].id;
  w.querySelectorAll('[data-jump]').forEach(function(j){ j.setAttribute('aria-current',j.getAttribute('data-jump')===cur); });
}
function trkTo(card,smooth){
  var t=card.parentNode;
  t.scrollTo({left:card.offsetLeft-parseFloat(getComputedStyle(t).scrollPaddingLeft||0),behavior:(smooth&&!REDUCED)?'smooth':'auto'});
}
function trkStep(w,dir){
  var t=w.querySelector('[data-trk-track]'), c=trkCards(t)[0]; if(!c) return;
  t.scrollBy({left:dir*(c.getBoundingClientRect().width+16),behavior:REDUCED?'auto':'smooth'});
}

/* ================================================================
   TOOL 1 — FUNNEL DIAGNOSTIC (logic lifted from prototype-funnel-diagnostic.html)
   Fix vs prototype: the slider no longer re-renders itself mid-drag.
   ================================================================ */
var SIM={preset:'ecom',stages:null,close:50};
function simNum(v){ v=String(v).replace(/[^0-9]/g,''); return v?parseInt(v,10):0; }
function simLoad(k){ SIM.preset=k; SIM.stages=C.funnel.presets[k].stages.map(function(x){ return {k:x.k,n:x.n,i:x.i,v:x.v,b:x.b}; }); }
simLoad('ecom');
function simCalc(){
  var st=SIM.stages, steps=[], broken=false, i, j;
  for(i=1;i<st.length;i++){
    var prev=st[i-1].v, cur=st[i].v, ok=prev>0&&cur<=prev;
    if(!ok) broken=true;
    var cr=prev>0?cur/prev:0;
    steps.push({i:i,n:st[i].n,cr:cr,b:st[i].b,gap:st[i].b?st[i].b-cr:0,ok:ok});
  }
  var base=st.map(function(x){return x.v;}), last=base.length-1, ranked=[];
  if(!broken){
    steps.forEach(function(s){
      if(!s.b||s.gap<=0) return;
      var sim=base.slice();
      for(j=s.i;j<=last;j++){
        if(j===s.i) sim[j]=sim[j-1]*s.b;
        else { var c0=base[j-1]>0?base[j]/base[j-1]:0; sim[j]=sim[j-1]*c0; }
      }
      s.recover=sim[last]-base[last]; ranked.push(s);
    });
    ranked.sort(function(a,b){return b.recover-a.recover;});
  }
  var worst=ranked[0]||null, sim2=base.slice(), extra=0, target=0;
  if(worst){
    target=worst.cr+worst.gap*(SIM.close/100);
    for(j=worst.i;j<=last;j++){
      if(j===worst.i) sim2[j]=sim2[j-1]*target;

var DT={ev:'cart',ctx:{existing:true,sensitive:false,friction:false,noserv:false,converted:false}};
function dtEval(){
  var S=C.trace, ev=null;
  S.events.forEach(function(e){ if(e.k===DT.ev) ev=e; });
  var matched=S.rules.filter(function(r){
    if(r.event&&r.event!==DT.ev) return false;
    if(r.notEvent&&r.notEvent===DT.ev) return false;
    if(r.when&&!DT.ctx[r.when]) return false;
    if(r.unless&&DT.ctx[r.unless]) return false;
    return true;
  }).sort(function(x,y){return y.p-x.p;});
  var w=matched[0]||null;
  var res=w?{dec:w.dec,code:w.code,act:w.act.slice(),why:w.why,cf:w.cf,id:w.id}
           :{dec:'No rule matched — observe only.',code:'—',act:['none'],why:'',cf:['','']};
  if(w&&w.id==='R-06'){
    var sens=DT.ctx.sensitive;
    res.code=w.code.replace('%S%',sens?'true':'false').replace('%A%',sens?'apply(eligible_offer)':'suppress(discount)');
    res.why=sens?'Evidence supports the discount, so it is released.':w.why;
    if(!sens) res.act=['wa'];
  }
  return {ev:ev,matched:matched,res:res,suppressed:(w&&w.id==='R-01')};
}
function dtOut(){
  var E=dtEval(), e=E.ev, r=E.res, h='';
  function st(k,body){ return '<div class="st"><div class="st-rail"><span class="st-dot"></span><span class="st-line"></span></div><div class="st-c"><div class="st-k">'+k+'</div>'+body+'</div></div>'; }
  if(E.suppressed) h+='<div class="st-sup"><b>Communication suppressed</b><span>She already ordered today. Every lifecycle action for this event is held — the most valuable decision the engine makes is often the one to stay quiet.</span></div>';
  h+=st('01 · Signal','<div class="st-h">'+e.n+'</div><div class="st-p">Indicates: '+e.ind+'</div>');
  h+=st('02 · Context assembled','<div class="st-p">What the engine reads before deciding.</div><div class="tags" style="margin-top:8px">'+e.sig.map(function(x){return '<span class="tag">'+x+'</span>';}).join('')+'</div>');
  var over=Math.max(0,E.matched.length-1);
  var ledger='<div class="rl2"><div class="rl2-h"><span>Rules evaluated</span><span>'+E.matched.length+' matched · '+(E.matched.length?1:0)+' executed · '+over+' overridden</span></div>'+
    E.matched.map(function(m,i){ return '<div class="rl2-r '+(i===0?'win':'lose')+'"><span class="rl2-p num">'+m.p+'</span><span>'+m.id+' · '+m.n+'</span><span class="rl2-s">'+(i===0?'executed':'lower priority')+'</span></div>'; }).join('')+'</div>';
  var cf=r.cf[0]?'<div class="vs" style="margin-top:10px"><div class="minus"><span>−</span><span>'+r.cf[0]+'</span></div><div class="plus"><span>+</span><span>'+r.cf[1]+'</span></div></div>':'';
  h+=st('03 · Decision','<div class="st-h">'+r.dec+'</div>'+ledger+'<pre class="code st-code">'+codeHtml(r.code)+'</pre>'+cf+(e.guard?'<div class="st-guard"><b>Guardrail · </b>'+e.guard+'</div>':''));
  var on={}; r.act.forEach(function(a){on[a]=1;});
  var chans=on.none?'<span class="ch2 none">No send</span>':C.trace.chans.map(function(c){return '<span class="ch2'+(on[c[0]]?' on':'')+'">'+c[1]+'</span>';}).join('');
  h+=st('04 · Activation','<div class="chs">'+chans+'</div>'+(r.why?'<div class="st-p" style="margin-top:8px">'+r.why+'</div>':''));
  h+=st('05 · Outcome measured','<div class="st-met">'+e.met.map(function(m){return '<div><span class="mk">'+m[0]+'</span><span class="mv">'+m[1]+'</span></div>';}).join('')+'</div>');
  h+=st('06 · Feedback','<div class="st-p">'+e.fb+'</div>');
  return h;
}
function dtHtml(){

    '<div class="dt-k">Event that fired</div><div role="radiogroup" aria-label="Event that fired">'+S.events.map(function(e,i){
      return '<button type="button" role="radio" class="dt-e'+(e.k===DT.ev?' on':'')+'" aria-checked="'+(e.k===DT.ev)+'" data-dte="'+e.k+'"><b class="num">0'+(i+1)+'</b>'+e.n+'</button>';}).join('')+'</div>'+

/* ================================================================
   MOBILE DIAL — ported from side-nav-prototype-v8.html.
   Unchanged: circularDistance, layoutWheel falloff (right = 58 − |d|^1.35 × 11,
   scale 1.08/.96/.87/.79, opacity 1/.72/.44/.24, rotate d × −2.2°), drag-to-rotate
   at 42px per step, wrap-around, keyboard model, idle fade, one-time hint.
   Adapted: items are the six routes; commit changes the route instead of
   scrolling to a section; the active item follows the router, not a scrollspy.
   Built once in shell(); listeners bound once.
   ================================================================ */
var DICON={
 '/':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>',
 '/work':'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
 '/gtm':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>',
 '/systems':'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
 '/simulators':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
 '/contact':'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
};
var DL={el:null,items:[],N:0,active:0,focused:0,lastStep:0,dragging:false,moved:false,startY:0,startIndex:0,idleT:null,hintShown:false,hintT:null};
function dwrap(i){ return ((i%DL.N)+DL.N)%DL.N; }
function dDist(index,center){
  var N=DL.N, d=index-center;
  while(d>N/2) d-=N; while(d<-N/2) d+=N;
  if(N%2===0&&Math.abs(d)===N/2) d=DL.lastStep<0?-N/2:N/2;
  return d;
}
function dialLayout(){
  if(!DL.el||!DL.el.classList.contains('engaged')) return;
  var rect=DL.el.getBoundingClientRect(), step=Math.min(54,Math.max(43,(rect.height-86)/6));
  DL.items.forEach(function(el,k){
    var d=dDist(k,DL.focused), ad=Math.abs(d), vis=ad<=3, right=vis?(58-Math.pow(ad,1.35)*11):8;
    el.style.setProperty('--wy',(d*step).toFixed(1)+'px');
    el.style.setProperty('--wr',Math.max(16,right).toFixed(1)+'px');
    el.style.setProperty('--ws',ad===0?1.08:ad===1?.96:ad===2?.87:.79);
    el.style.setProperty('--wo',ad===0?1:ad===1?.72:ad===2?.44:.24);
    el.style.setProperty('--wrot',(d*-2.2).toFixed(1)+'deg');
    el.classList.toggle('hid',!vis);
  });
}
function dialRest(i){
  var P=C.nav, q=function(k){return DICON[P[dwrap(k)][0]];};
  DL.el.querySelector('[data-peek="-1"]').innerHTML=q(i-1);
  DL.el.querySelector('[data-peek="0"]').innerHTML=q(i);
  DL.el.querySelector('[data-peek="1"]').innerHTML=q(i+1);
  DL.el.setAttribute('aria-label','Page dial. Currently on '+C.nav[i][1]+'. Press and hold, then drag up or down to browse; release to go. Keyboard: Enter opens, arrow keys rotate, Enter chooses, Escape cancels.');
}
function dAnnounce(m){ var l=document.querySelector('[data-dial-live]'); l.textContent=''; setTimeout(function(){ l.textContent=m; },30); }
function dArmIdle(){ clearTimeout(DL.idleT); DL.el.classList.remove('idle'); DL.idleT=setTimeout(function(){ if(!DL.el.classList.contains('engaged')) DL.el.classList.add('idle'); },3500); }
function dDismissHint(){ if(DL.hintShown) return; DL.hintShown=true; clearTimeout(DL.hintT);
  document.querySelector('[data-dial-hint]').classList.remove('show'); DL.el.querySelector('.dial-grip').classList.remove('pulse'); }
function dSetFocused(i,say){
  DL.focused=dwrap(i);

function dClose(){

  DL.items.forEach(function(el){ el.classList.remove('focused','near','hid'); }); dArmIdle();
}
function dCommit(i){

function dialSync(path){

  var i=0; C.nav.forEach(function(n,k){ if(n[0]===path) i=k; });

}
function dialInit(){
  var el=document.querySelector('[data-dial]'); DL.el=el; DL.N=C.nav.length;
  el.innerHTML='<div class="dial-grip" aria-hidden="true"></div><div class="dial-rest" aria-hidden="true"><div class="peek" data-peek="-1"></div><div class="peek cur" data-peek="0"></div><div class="peek" data-peek="1"></div></div>'+
    '<div class="wlist" role="listbox" aria-label="Pages">'+C.nav.map(function(n,k){
      return '<div class="witem" id="dw-'+k+'" role="option" aria-selected="false">'+DICON[n[0]]+'<span>'+n[1]+'</span></div>';}).join('')+'</div>';
  DL.items=[].slice.call(el.querySelectorAll('.witem'));
  el.addEventListener('pointerdown',function(e){ e.preventDefault(); DL.dragging=true; DL.moved=false; DL.startY=e.clientY; DL.startIndex=DL.active; DL.lastStep=0;
    try{ el.setPointerCapture(e.pointerId); }catch(x){} dOpen(); });
  el.addEventListener('pointermove',function(e){ if(!DL.dragging) return; var delta=e.clientY-DL.startY; if(Math.abs(delta)>4) DL.moved=true;
    var steps=Math.round(-delta/42); if(steps!==DL.lastStep){ DL.lastStep=steps; dSetFocused(DL.startIndex+steps); } });
  function finish(){ if(!DL.dragging) return; DL.dragging=false; if(DL.moved) dCommit(DL.focused); else dCancel(); }
  el.addEventListener('pointerup',finish); el.addEventListener('pointercancel',finish);
  el.addEventListener('pointerenter',dArmIdle); el.addEventListener('focus',dArmIdle);
  el.addEventListener('keydown',function(e){
    var on=el.classList.contains('engaged');
    if(!on){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); dOpen(); } return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); DL.lastStep=1; dSetFocused(DL.focused+1,true); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); DL.lastStep=-1; dSetFocused(DL.focused-1,true); }
    else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); dCommit(DL.focused); }
    else if(e.key==='Escape'){ e.preventDefault(); dCancel(); }
  });
  dArmIdle();
  DL.hintT=setTimeout(function(){ if(DL.hintShown) return; var h=document.querySelector('[data-dial-hint]'); h.classList.add('show');
    if(!REDUCED) el.querySelector('.dial-grip').classList.add('pulse'); setTimeout(function(){ h.classList.remove('show'); },4000); },900);
}

function parse(){
  var raw=(location.hash||'#/').slice(1); if(raw.charAt(0)!=='/') raw='/'+raw;
  var parts=raw.split('?'), path=parts[0].replace(/\/+$/,'')||'/', q={};
  (parts[1]||'').split('&').forEach(function(kv){ if(!kv) return; var p=kv.split('='); q[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||''); });
  return {path:path,q:q};
}
var TITLES={'/':'home','/gtm':'gtm','/systems':'systems','/work':'work','/simulators':'sim','/contact':'contact'};
function countUp(el){
  if(REDUCED||el.dataset.done) return; el.dataset.done='1';
  var to=parseFloat(el.dataset.to), dec=+el.dataset.dec, pre=el.dataset.pre, suf=el.dataset.suf, t0=null, dur=900;
  function step(ts){
    if(!el.isConnected) return;
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-k,3), v=to*e;
    el.textContent=pre+(dec?v.toFixed(dec):fmt(v))+suf;
    if(k<1) rafs.push(requestAnimationFrame(step));
  }
  rafs.push(requestAnimationFrame(step));
}
function observe(){
  if(io) io.disconnect();
  rafs.forEach(cancelAnimationFrame); rafs=[];
  var els=$main.querySelectorAll('.rv');
  if(REDUCED||!('IntersectionObserver' in window)){ els.forEach(function(e){e.classList.add('in');}); return; }
  io=new IntersectionObserver(function(list){
    list.forEach(function(en){
      if(!en.isIntersecting) return;
      en.target.classList.add('in');
      en.target.querySelectorAll('.cu').forEach(countUp);
      io.unobserve(en.target);
    });
  },{rootMargin:'0px 0px -8% 0px',threshold:0.08});
  els.forEach(function(e){ io.observe(e); });
}

/* ================================================================
   ROUND 4 · MOTION LAYER
   - Typewriter on every hero, slower, and layout-stable
   - Effects 09–14 of the motion library, applied where they fit
   Reduced motion: none of this starts; the hero phrase is shown in full.
   Everything transient (word wrappers, scatter offsets, row hiding) is
   removed again when it finishes, so the resting DOM matches the original.
   ================================================================ */
var FXT=[], FXIO=null, FXRAF=[], FXGRAIN={timer:null};
function fxLater(fn,ms){ var t=setTimeout(fn,ms); FXT.push(t); return t; }
function fxReset(){
  FXT.forEach(clearTimeout); FXT=[]; FXRAF.forEach(cancelAnimationFrame); FXRAF=[];
  if(FXIO){ FXIO.disconnect(); FXIO=null; }
  if(FXGRAIN.timer){ clearInterval(FXGRAIN.timer); FXGRAIN.timer=null; }
}

/* ---------------- Kinetic reveal: word-by-word line wipe ---------------- */
function kwWrap(el){
  var n=0, nodes=[], t, w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  while((t=w.nextNode())) nodes.push(t);
  nodes.forEach(function(tn){
    if(tn.parentNode.closest('.accent,[data-typetext],.caret')) return;   /* the typed phrase is left alone */
    var frag=document.createDocumentFragment();
    tn.nodeValue.split(/(\s+)/).forEach(function(p){
      if(!p) return;
      if(/^\s+$/.test(p)){ frag.appendChild(document.createTextNode(p)); return; }
      var o=document.createElement('span'), i=document.createElement('span');
      o.className='kw-w'; i.className='kw-i'; i.style.setProperty('--i',n++); i.textContent=p; o.appendChild(i); frag.appendChild(o);
    });
    tn.parentNode.replaceChild(frag,tn);
  });
  if(n) el.setAttribute('data-kw','1');
  return n;
}
function kwUnwrap(el){
  if(!el.isConnected) return;
  el.querySelectorAll('.kw-w').forEach(function(w){ w.parentNode.replaceChild(document.createTextNode(w.textContent),w); });
  el.normalize(); el.classList.remove('kw-go'); el.removeAttribute('data-kw'); el.removeAttribute('data-kw-pending');
}
function kwPlay(el,n,delay){
  fxLater(function(){ if(el.isConnected) el.classList.add('kw-go'); },delay);
  fxLater(function(){ kwUnwrap(el); },delay+850+n*45+180);
}

/* ---------------- Typewriter: every hero, slower ---------------- */
function typeHero(root, wait){
  var h=root.querySelector('[data-typeh1]'); if(!h) return;
  var acc=h.querySelector('[data-typetext]'), t=acc.querySelector('.tw-t'), r=acc.querySelector('.tw-r'), full=acc.getAttribute('data-typetext');
  if(REDUCED){ t.textContent=full; r.textContent=''; return; }
  var i=0, base=Math.min(80,2400/full.length);       /* ~100ms a letter on average (it was ~45ms), capped so long phrases stay under ~3s */
  function step(){
    if(!acc.isConnected) return;
    if(i===0) h.classList.add('tw-on');
    i++; t.textContent=full.slice(0,i); r.textContent=full.slice(i);
    if(i<full.length) fxLater(step, base+Math.random()*base*.55+(full.charAt(i-1)===' '?110:0));
  }
  fxLater(step,wait||0);
}
function fxHero(root){
  var h=root.querySelector('[data-typeh1]');
  if(h){ var n=kwWrap(h); kwPlay(h,n,60); typeHero(root,60+560+n*45); }
  root.querySelectorAll('.case-hero h1.h1, .hero h1.h1:not([data-typeh1])').forEach(function(e){ var n=kwWrap(e); if(n) kwPlay(e,n,60); });
}
function fxHeadings(root){
  root.querySelectorAll('h2.h2').forEach(function(e){ if(kwWrap(e)) e.setAttribute('data-kw-pending','1'); });
}

/* ---------------- Count-up on the headline figures that were static ---------------- */
var FXCOUNT='.mstrip .v, .case-metric b, .pc-metric b, .fig, .goal-num';
function fxCountText(txt,k){
  return txt.replace(/\d[\d,]*\.?\d*/g,function(tok){
    var dec=(tok.split('.')[1]||'').length, comma=tok.indexOf(',')>-1, to=parseFloat(tok.replace(/,/g,'')), v=to*k;
    var s=dec?v.toFixed(dec):String(Math.round(v));
    return comma?Number(s).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}):s;
  });
}
function fxCountPrep(root){
  root.querySelectorAll(FXCOUNT).forEach(function(el){
    if(el.closest('.sb')||el.querySelector('.cu')||el.children.length) return;
    var txt=el.textContent, toks=txt.match(/\d[\d,]*\.?\d*/g); if(!toks) return;
    if(toks.some(function(x){ return x.indexOf(',')>-1&&!/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(x); })) return;
    el.setAttribute('data-count',''); el._fxTxt=txt;
    el.textContent=fxCountText(txt,0);   /* every figure starts at zero and counts up when it enters view */
  });
}
function fxCountRun(el){
  var t0=null, dur=1100, txt=el._fxTxt;
  el.textContent=fxCountText(txt,0);
  function tick(ts){
    if(!el.isConnected) return;
    if(t0===null) t0=ts;
    var p=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=p<1?fxCountText(txt,e):txt;
    if(p<1) FXRAF.push(requestAnimationFrame(tick));
  }
  FXRAF.push(requestAnimationFrame(tick));
}

  root.querySelectorAll('.applies,.mstrip,.chain').forEach(function(g){

/* grain: one noise tile, redrawn about every 90ms, only while a grain surface is on screen */
function fxGrainSync(){
  var live=[].slice.call(document.querySelectorAll('.fx-grain')).filter(function(c){ return c.parentNode.classList.contains('fx-on'); });
  if(!live.length){ if(FXGRAIN.timer){ clearInterval(FXGRAIN.timer); FXGRAIN.timer=null; } return; }
  if(FXGRAIN.timer) return;
  function paint(){
    /* each canvas is sized to its panel at one third scale, so the grain stays square and uniform on any shape */
    [].slice.call(document.querySelectorAll('.fx-grain')).forEach(function(c){
      if(!c.isConnected||!c.parentNode.classList.contains('fx-on')) return;
      var p=c.parentNode, w=Math.max(48,Math.ceil(p.clientWidth/3)), h=Math.max(48,Math.ceil(p.clientHeight/3));
      if(c.width!==w||c.height!==h){ c.width=w; c.height=h; }
      var cx=c.getContext('2d'); if(!cx) return;
      var img=cx.createImageData(w,h), d=img.data;
      for(var k=0;k<d.length;k+=4){ var v=Math.random()*255|0; d[k]=d[k+1]=d[k+2]=v>127?255:0; d[k+3]=Math.abs(v-127)*.34|0; }   /* light and dark speckle as plain alpha: no blend mode, so it costs almost nothing to composite */
      cx.putImageData(img,0,0);
    });
  }
  paint(); FXGRAIN.timer=setInterval(paint,90);
}

/* ---------------- One observer drives every entrance and pauses off-screen work ---------------- */
function fxEnter(el){
  if(el.hasAttribute('data-kw-pending')){ el.removeAttribute('data-kw-pending'); var n=el.querySelectorAll('.kw-w').length; kwPlay(el,n,40); }
  if(el.hasAttribute('data-collapse')&&!el._fxIn){
    el._fxIn=1; el.classList.add('fx-in');
    fxLater(function(){ el.removeAttribute('data-collapse'); el.classList.remove('fx-in'); [].slice.call(el.children).forEach(function(k){ ['--x','--y','--r','--d'].forEach(function(p){ k.style.removeProperty(p); }); }); },800+(el.children.length*55)+900);
  }
  if(el.hasAttribute('data-retro')&&!el._fxIn){
    el._fxIn=1;
    fxLater(function(){ el.removeAttribute('data-retro'); el.querySelectorAll('.fx-line').forEach(function(x){ x.classList.remove('fx-line'); x.style.removeProperty('--rd'); }); },(.25+(el._fxLines||0)*.09+.7)*1000);
  }
  ['goal'].forEach(function(k){
    var arm='data-'+k+'-arm';
    if(el.hasAttribute(arm)&&!el._fxIn){
      el._fxIn=1; el.classList.add('fx-in');
      fxLater(function(){ el.removeAttribute(arm); el.classList.remove('fx-in'); },3200);
    }
  });
  if(el.hasAttribute('data-count')&&!el._fxDone){ el._fxDone=1; fxLater(function(){ fxCountRun(el); },160); }
}
function fxObserve(root){
  FXIO=new IntersectionObserver(function(list){
    list.forEach(function(en){
      try{
        var el=en.target;
        if(el.hasAttribute('data-fx')) el.classList.toggle('fx-on',en.isIntersecting);
        if(en.isIntersecting) fxEnter(el);
      }catch(e){}
    });
    try{ fxGrainSync(); }catch(e){}
  },{rootMargin:'0px 0px -8% 0px',threshold:.2});
  root.querySelectorAll('[data-fx],[data-kw-pending],[data-collapse],[data-retro],[data-count],[data-goal-arm]').forEach(function(e){ FXIO.observe(e); });
}
/* safety net: anything already in view that never got started (a missed observer callback on a slow device) is started here */
function fxSweep(){
  if(REDUCED) return;
  var vh=window.innerHeight;
  document.querySelectorAll('[data-count],[data-kw-pending]').forEach(function(el){
    var r=el.getBoundingClientRect();
    if(r.bottom>0&&r.top<vh*.92&&r.right>0&&r.left<window.innerWidth) try{ fxEnter(el); }catch(e){}
  });
}
var FXSWEEP=null;
/* capture phase: scrolls inside a horizontal track do not bubble to the window, and that is where figures wait to be reached */
window.addEventListener('scroll',function(){ clearTimeout(FXSWEEP); FXSWEEP=setTimeout(fxSweep,260); },{passive:true,capture:true});
function fxRender(root){
  fxReset();
  if(REDUCED||!('IntersectionObserver' in window)){ typeHero(root,0); return; }
  /* each step is isolated: a failure in one can never stop the others or leave a headline hidden */
  [fxHero,fxHeadings,fxAttach,fxCountPrep,fxObserve].forEach(function(f){ try{ f(root); }catch(e){} });
  fxLater(fxSweep,2600);
}

/* the enquiry form */
function formSending(f,on){
  var btn=f.querySelector('button[type="submit"]'); if(!btn) return;
  if(!btn.getAttribute('data-label')) btn.setAttribute('data-label',btn.textContent);
  f.setAttribute('data-sending',on?'1':'0'); btn.disabled=!!on; btn.textContent=on?'Sending…':btn.getAttribute('data-label'); btn.setAttribute('aria-busy',on?'true':'false');
}
function formDone(f,d){
  formSending(f,false); f.hidden=true;
  var done=f.parentNode.querySelector('[data-done]'); done.querySelector('[data-done-mail]').textContent=d.email; done.hidden=false;
  var h=done.querySelector('[data-done-h]'); if(h) h.focus({preventScroll:false});
}
function formFail(f,d){
  formSending(f,false);
  var box=f.querySelector('[data-form-err]'), body='Name: '+d.name+'\nCompany: '+(d.company||'—')+'\nEmail: '+d.email+'\nBusiness model: '+(d.model||'—')+'\nPrimary bottleneck: '+d.bottleneck+'\nMonthly orders: '+(d.volume||'—')+'\n\n'+d.message;
  box.querySelector('[data-err-mail]').setAttribute('href','mailto:'+C.person.email+'?subject='+encodeURIComponent('Bottleneck: '+d.bottleneck+(d.company?' — '+d.company:''))+'&body='+encodeURIComponent(body));
  box.hidden=false; box.focus();
}
document.addEventListener('submit',function(ev){
  var f=ev.target; if(!f.hasAttribute('data-form')) return;
  ev.preventDefault();
  if(f.getAttribute('data-sending')==='1') return;                          /* no double sends */
  var d={}; ['name','company','email','model','bottleneck','volume','message'].forEach(function(k){ d[k]=(f.elements[k].value||'').trim(); });
  var errs={name:d.name?'':'Add your name.',email:/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)?'':'Add a valid email address.',
    bottleneck:d.bottleneck?'':'Pick the closest bottleneck.',message:d.message?'':'Describe the number, even roughly.'};
  var first=null;
  Object.keys(errs).forEach(function(k){ f.querySelector('[data-err="'+k+'"]').textContent=errs[k]; if(errs[k]&&!first) first=f.elements[k]; f.elements[k].setAttribute('aria-invalid',!!errs[k]); });
  if(first){ first.focus(); return; }
  f.querySelector('[data-form-err]').hidden=true;
  if(f.elements.botcheck&&f.elements.botcheck.checked){ formDone(f,d); return; }   /* honeypot: a bot sees "sent" and nothing is sent */
  var payload={access_key:W3F.key,subject:'Bottleneck: '+d.bottleneck+(d.company?' — '+d.company:''),from_name:'Anjor Tank site',
    name:d.name,email:d.email,company:d.company||'—',business_model:d.model||'—',primary_bottleneck:d.bottleneck,monthly_orders:d.volume||'—',message:d.message,botcheck:''};
  formSending(f,true);
  if(!window.fetch){ formFail(f,d); return; }
  var ctl=('AbortController' in window)?new AbortController():null, timer=setTimeout(function(){ if(ctl) ctl.abort(); },15000);
  fetch(W3F.url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(x){ clearTimeout(timer); if(x.ok&&x.j&&x.j.success) formDone(f,d); else formFail(f,d); })
    .catch(function(){ clearTimeout(timer); formFail(f,d); });
});

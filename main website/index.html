<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Chakra+Petch:wght@600&display=swap" rel="stylesheet">
<style>
/* ================================================================
   TOKENS — colour, space, radius and motion from Design system.html.
   Typography overridden by Anjor's instruction: Space Grotesk
   (headings) + IBM Plex Sans (everything else). Chakra Petch is
   loaded at one weight for the wordmark only, so the logo is not
   rebuilt.
   ================================================================ */
:root{
  --void:#0D0E10; --tech-white:#EBE7E2; --violet:#7560FF; --violet-lift:#8F7DFF;
  --gray-900:#1B1C20; --gray-800:#2A2B31; --gray-500:#5E6068; --gray-300:#8A8D99;
  --ok:#3ED598; --warn:#E0A030; --stop:#FF6B5A;
  --bg:var(--void); --frame:#121317; --surface:var(--gray-900); --surface-2:var(--gray-800);
  --border:#26272D; --border-strong:#3A3C44; --hair:rgba(235,231,226,.07);
  --text:var(--tech-white); --text-2:var(--gray-300); --text-3:var(--gray-500);
  --accent:var(--violet); --accent-soft:rgba(117,96,255,.14); --accent-line:rgba(117,96,255,.32);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.34);
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:48px;--s-8:64px;--s-9:88px;--s-10:128px;
  --r-s:10px;--r:14px;--r-l:20px;--r-xl:26px;--r-full:999px;
  --e-out:cubic-bezier(.22,.85,.3,1); --e-spring:cubic-bezier(.34,1.4,.64,1);
  --t-fast:160ms; --t-base:240ms; --t-slow:520ms;
  --f-head:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mark:'Chakra Petch','Space Grotesk',sans-serif;

  /* Centralized type scale — component selectors consume these shared tokens.
     Desktop values are fixed px per Anjor's typography system; --fs-h1/h2/h3
     are additionally scaled down at the two breakpoints below (760px/1080px)
     so headings don't wrap to one word per line on narrow viewports. */
  --fs-h1:65px; --fs-h2:45px; --fs-h3:25px;
  --fs-body:16px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-20:20px;

  --wrap:1200px; --gut:24px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:var(--fs-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--violet);color:#fff;padding:8px 14px;border-radius:var(--r-s);z-index:100}
.skip:focus{left:12px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--f-head);font-weight:500;margin:0;color:var(--text);text-wrap:balance}
.h1{font-size:var(--fs-h1);line-height:1.02;letter-spacing:-.035em}
.h2{font-size:var(--fs-h2);line-height:1.06;letter-spacing:-.03em}
.h3{font-size:var(--fs-h3);line-height:1.2;letter-spacing:-.02em}
.h4{font-size:17px;line-height:1.35;letter-spacing:-.01em}
.lead{font-size:var(--fs-20);line-height:1.55;color:var(--text-2);max-width:60ch;margin:0}
.p{color:var(--text-2);margin:0;max-width:62ch}
.small{font-size:13.5px;line-height:1.5;color:var(--text-2)}
.label{font-size:var(--fs-20);font-weight:500;color:var(--text-2);letter-spacing:0}
.label b{color:var(--text);font-weight:500}

/* ---------- buttons (always paired) ---------- */
.dual{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-full);
  font-size:14.5px;font-weight:500;white-space:nowrap;transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.btn-p{background:var(--tech-white);color:var(--void)}
.btn-p:hover{background:#fff}
.btn-s{border:1px solid var(--border-strong);color:var(--text)}
.btn-s:hover{border-color:var(--gray-500);background:rgba(235,231,226,.04)}
.btn.sm{height:34px;padding:0 13px;font-size:13.5px}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:rgba(13,14,16,.72);backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--hair)}
.hdr-in{display:flex;align-items:center;height:64px;gap:28px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand svg{width:26px;height:26px}
.wm{font-family:var(--f-mark);font-weight:600;letter-spacing:.3em;font-size:13.5px;color:var(--text)}
.nav{display:flex;gap:2px;flex:1}
.nav a{font-size:14px;color:var(--text-2);padding:6px 11px;border-radius:var(--r-full);transition:color var(--t-fast),background var(--t-fast)}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);background:rgba(235,231,226,.06)}
.hdr-cta{display:flex;gap:8px}
.burger{display:none;width:40px;height:40px;border-radius:var(--r-full);align-items:center;justify-content:center;margin-left:auto}
.burger span{display:block;width:16px;height:1.5px;background:var(--text);position:relative;transition:transform var(--t-base) var(--e-out)}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:16px;height:1.5px;background:var(--text);transition:transform var(--t-base) var(--e-out)}
.burger span::before{top:-5px}.burger span::after{top:5px}
.menu-open .burger span{background:transparent}
.menu-open .burger span::before{transform:translateY(5px) rotate(45deg)}
.menu-open .burger span::after{transform:translateY(-5px) rotate(-45deg)}
.sheet{display:none}
.theme-toggle{width:40px;height:40px;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--text-2);border:1px solid transparent;transition:color var(--t-fast),background var(--t-fast),border-color var(--t-fast)}
.theme-toggle:hover{color:var(--text);background:rgba(235,231,226,.04);border-color:var(--border)}
.theme-toggle svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .theme-moon{display:none}
html[data-theme="light"] .theme-toggle .theme-sun{display:none}
html[data-theme="light"] .theme-toggle .theme-moon{display:block}
body.menu-open{overflow:hidden}
.menu-open .sheet{display:block;position:fixed;inset:64px 0 auto 0;width:100vw;height:calc(100dvh - 64px);background:var(--bg);z-index:49;padding:12px max(var(--gut),calc((100vw - var(--wrap))/2 + var(--gut))) 40px;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--hair)}
.sheet a{display:block;font-family:var(--f-head);font-size:clamp(28px,4vw,48px);letter-spacing:-.025em;padding:12px 0;border-bottom:1px solid var(--hair);color:var(--text-2);transition:color var(--t-fast)}
.sheet a:hover,.sheet a[aria-current="page"]{color:var(--text)}
.sheet .dual{margin-top:24px}
.sheet .dual .btn{font-family:var(--f-body);font-size:14.5px;border-bottom:0;padding:0 16px;display:inline-flex}
.sheet-theme{display:flex;align-items:center;gap:10px;width:100%;padding:14px 0;margin-top:8px;border-bottom:1px solid var(--hair);color:var(--text-2);font-size:14px;text-align:left}
.sheet-theme:hover{color:var(--text)}
.sheet-theme svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sheet-theme .theme-moon{display:none}
html[data-theme="light"] .sheet-theme .theme-sun{display:none}
html[data-theme="light"] .sheet-theme .theme-moon{display:block}

/* ---------- light mode — additive token override; dark remains the default ---------- */
html[data-theme="light"]{
  --bg:#F7F6F3; --frame:#FFFFFF; --surface:#FFFFFF; --surface-2:#F0EEE9;
  --border:#DDD9D2; --border-strong:#C4BEB5; --hair:rgba(13,14,16,.08);
  --text:#18191D; --text-2:#5E6068; --text-3:#858892;
  --shadow:0 1px 2px rgba(13,14,16,.06),0 12px 32px rgba(13,14,16,.08);
  color-scheme:light;
}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"] .hdr{background:rgba(247,246,243,.78)}
html[data-theme="light"] .btn-s:hover,
html[data-theme="light"] .nav a[aria-current="page"],
html[data-theme="light"] .theme-toggle:hover,
html[data-theme="light"] .dlog-row:hover,
html[data-theme="light"] .rail button:hover,
html[data-theme="light"] .xl a:hover,
html[data-theme="light"] .trk-btn:hover,
html[data-theme="light"] .dt-e:hover,
html[data-theme="light"] .dt-c:hover{background:rgba(13,14,16,.04)}
html[data-theme="light"] .frame{background:linear-gradient(180deg,#FFFFFF 0%,var(--frame) 30%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7)}
html[data-theme="light"] .card .vis{background:linear-gradient(180deg,rgba(13,14,16,.035),rgba(13,14,16,.012))}
html[data-theme="light"] .chip,
html[data-theme="light"] .tag,
html[data-theme="light"] .chainline span{background:rgba(13,14,16,.045)}
html[data-theme="light"] .code,
html[data-theme="light"] .wcard .trio{background:rgba(13,14,16,.035)}
html[data-theme="light"] .applies span{background:linear-gradient(180deg,#FFFFFF,#FAF9F7)}
html[data-theme="light"] .applies span:hover{background:linear-gradient(180deg,rgba(117,96,255,.075),#FFFFFF)}
html[data-theme="light"] .ecard,
html[data-theme="light"] .wcard{background:linear-gradient(180deg,#FFFFFF,var(--frame))}
html[data-theme="light"] .ecard.hl{background:var(--violet);border-color:var(--violet);color:#fff}
html[data-theme="light"] .ecard.hl .n,
html[data-theme="light"] .ecard.hl p,
html[data-theme="light"] .ecard.hl .dur{color:rgba(255,255,255,.88)}
html[data-theme="light"] .ecard.hl h3,
html[data-theme="light"] .ecard.hl .dur b{color:#fff}
html[data-theme="light"] .srow input,
html[data-theme="light"] .fld input,
html[data-theme="light"] .fld select,
html[data-theme="light"] .fld textarea{background:#FFFFFF}
html[data-theme="light"] .strack{background:rgba(13,14,16,.08)}
html[data-theme="light"] .btn-p{background:var(--void);color:var(--tech-white)}
html[data-theme="light"] .btn-p:hover{background:#000}
html[data-theme="light"] .flt button[aria-pressed="true"],
html[data-theme="light"] .jump button[aria-current="true"]{color:var(--tech-white);background:var(--void);border-color:var(--void)}
html[data-theme="light"] .hero-glow{background:radial-gradient(60% 55% at 50% 0%,rgba(117,96,255,.10),transparent 70%)}

/* ---------- page + sections (Linear rhythm) ---------- */
main{display:block;min-height:70vh}
.hero{padding:var(--s-8) 0 var(--s-7);position:relative}
.hero .label{margin-bottom:var(--s-4)}
.hero .h1{max-width:16ch}
.hero .lead{margin-top:var(--s-5)}
.hero .dual{margin-top:var(--s-6)}
.hero-glow{position:absolute;inset:0 0 auto 0;height:640px;pointer-events:none;z-index:-1;
  background:radial-gradient(60% 55% at 50% 0%,rgba(117,96,255,.13),transparent 70%)}
.sec{padding:var(--s-8) 0}
.sec + .sec{border-top:1px solid var(--hair)}
.sh{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--s-4) var(--s-8);align-items:end;margin-bottom:var(--s-6)}
.sh .label{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.sh .label .pill{margin-left:auto}
.sh .p{padding-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-full);
  border:1px solid var(--border);font-size:var(--fs-18);line-height:1;color:var(--text-2);transition:color var(--t-fast),border-color var(--t-fast)}
a.pill:hover{color:var(--text);border-color:var(--border-strong)}
.pill .plus{font-size:15px;line-height:1;color:var(--text)}

/* ---------- product frame (the big Linear panel) ---------- */
.frame{position:relative;border-radius:var(--r-l);background:linear-gradient(180deg,#15161B 0%,var(--frame) 30%);
  border:1px solid var(--border);box-shadow:var(--shadow),inset 0 1px 0 rgba(235,231,226,.06);overflow:hidden}
.frame-bar{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;border-bottom:1px solid var(--border);font-size:var(--fs-20);color:var(--text-2)}
.frame-bar b{color:var(--text);font-weight:500}
.frame-bar .sp{flex:1}
.frame-note{font-size:12.5px;color:var(--text-3);padding:10px 16px;border-top:1px solid var(--border)}
.frame-note b{color:var(--warn);font-weight:500}

/* ---------- accordion (Simulators) ---------- */
.acc{border-radius:var(--r-l);background:linear-gradient(180deg,#15161B 0%,var(--frame) 30%);
  border:1px solid var(--border);box-shadow:var(--shadow),inset 0 1px 0 rgba(235,231,226,.06);overflow:hidden}
.acc+.acc{margin-top:14px}
.acc-h{margin:0}
.acc-btn{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:22px 22px;transition:background var(--t-fast)}
.acc-btn:hover{background:rgba(235,231,226,.02)}
.acc-kicker{display:block;font-size:12px;color:var(--violet-lift);letter-spacing:.02em}
.acc-main{flex:1;min-width:0}
.acc-title{display:block;font-family:var(--f-head);font-size:var(--fs-h3);line-height:1.25;letter-spacing:-.015em;color:var(--text);margin-top:2px}
.acc-desc{display:block;font-size:14px;line-height:1.5;color:var(--text-2);margin-top:6px;max-width:56ch}
.acc-meta{flex-shrink:0;font-size:12.5px;color:var(--text-3);white-space:nowrap;display:none}
.acc-chev{flex-shrink:0;width:18px;height:18px;stroke:var(--text-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t-base) var(--e-out)}
.acc-btn[aria-expanded="true"] .acc-chev{transform:rotate(180deg)}
.acc-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-base) var(--e-out)}
.acc-wrap.open{grid-template-rows:1fr}
.acc-inner{overflow:hidden;min-height:0}
.acc-inner>.frame{border:0;border-radius:0;border-top:1px solid var(--border);background:rgba(0,0,0,.14);box-shadow:none}
.acc-body{padding:22px}
.acc-body p{margin:0 0 14px;font-size:14.5px;line-height:1.65;color:var(--text-2)}
.acc-body p:last-child{margin-bottom:0}
.acc-faq{margin-top:16px;padding-top:16px;border-top:1px solid var(--hair)}
.acc-faq dt{font-family:var(--f-head);font-size:15px;color:var(--text);margin-top:14px;letter-spacing:-.01em}
.acc-faq dt:first-child{margin-top:0}
.acc-faq dd{margin:5px 0 0;font-size:14px;line-height:1.55;color:var(--text-2)}
@media (min-width:560px){ .acc-meta{display:block} }

/* status chips — honest semantics */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:var(--r-full);font-size:var(--fs-16);line-height:1.15;font-weight:500;
  background:rgba(235,231,226,.05);color:var(--text-2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:rgba(62,213,152,.1)}
.chip.warn{color:var(--warn);background:rgba(224,160,48,.1)}
.chip.stop{color:var(--stop);background:rgba(255,107,90,.1)}
.chip.vi{color:var(--violet-lift);background:var(--accent-soft)}
.chip.plain::before{display:none}

/* ---------- feature cards (Linear row: visual, then title + text; no boxes) ---------- */
.cards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:var(--s-6) var(--s-5);margin-top:var(--s-6)}
.card .vis{height:132px;border-radius:var(--r);background:linear-gradient(180deg,rgba(235,231,226,.035),rgba(235,231,226,.01));
  display:flex;align-items:center;justify-content:center;margin-bottom:var(--s-4);color:var(--gray-300)}
.card .vis svg{width:100%;height:100%}
.card p{margin:6px 0 0;color:var(--text-2);font-size:14.5px;line-height:1.55}
.card .proof{margin-top:10px;font-size:13px;color:var(--text-2);padding-top:10px;border-top:1px solid var(--hair)}
.card .proof b{color:var(--text);font-weight:500}

/* ---------- home hero entry blocks ---------- */
.hcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:var(--s-6)}
.hcard{position:relative;overflow:hidden;border-radius:var(--r-l);padding:24px 28px 26px;min-height:260px;display:flex;flex-direction:column;align-items:flex-start;color:var(--void)}
.hcard .fig{position:absolute;right:0;top:0;bottom:0;width:46%;pointer-events:none}
.hcard .fig svg{width:100%;height:100%;overflow:visible}
.hcard .st{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:var(--r-s);background:rgba(255,255,255,.72);font-size:13px;font-weight:500;color:var(--void);position:relative}
.hcard .st i{width:9px;height:9px;border-radius:50%;background:var(--violet)}
.hcard h2{font-size:var(--fs-h2);line-height:1.12;letter-spacing:-.025em;margin-top:auto;padding-top:40px;max-width:13ch;color:inherit;position:relative}
.hcard p{margin:10px 0 0;font-size:14.5px;line-height:1.5;max-width:30ch;opacity:.82;position:relative}
.hcard .go{margin-top:20px;font-size:var(--fs-18);font-weight:600;padding-bottom:3px;border-bottom:1.5px solid currentColor}
.hcard .go::after{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit}
.hcard{transition:transform var(--t-base) var(--e-out)}
.hcard:hover{transform:translateY(-2px)}
.hcard:focus-within{outline:2px solid var(--violet-lift);outline-offset:3px}
.hcard .go:focus-visible{outline:none}
.hc-white{background:var(--tech-white)}
.hc-violet{background:var(--violet);color:#fff}
.hc-violet .st{background:rgba(255,255,255,.18);color:#fff}.hc-violet .st i{background:#fff}
.hc-violet p{opacity:.92}
.hc-tint{background:#DCD6FF}
.hc-stone{background:#CFC9C1}
.hc-stone .st i{background:var(--void)}

/* ---------- decision log ---------- */
.dlog{display:grid;grid-template-columns:1.35fr 1fr;min-height:420px}
.dlog-list{border-right:1px solid var(--border)}
.dlog-row{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:start;width:100%;text-align:left;padding:14px 16px;
  border-bottom:1px solid var(--hair);transition:background var(--t-fast)}
.dlog-row:hover{background:rgba(235,231,226,.025)}
.dlog-row[aria-selected="true"]{background:rgba(117,96,255,.08)}
.dlog-row .ix{font-size:12px;color:var(--text-3);padding-top:2px}
.dlog-row .sg{font-size:var(--fs-20);color:var(--text);font-weight:500}
.dlog-row .cx{font-size:var(--fs-16);color:var(--text-2);margin-top:2px}
.dlog-det{padding:20px}
.dlog-det .k{font-size:var(--fs-18);color:var(--text-3);margin:18px 0 6px}
.dlog-det .k:first-child{margin-top:0}
.dlog-det .dec{font-family:var(--f-head);font-size:19px;line-height:1.3;letter-spacing:-.01em}
.code{font-family:var(--f-body);font-size:12.5px;line-height:1.7;background:rgba(0,0,0,.28);border:1px solid var(--hair);border-radius:var(--r-s);
  padding:12px 14px;white-space:pre-wrap;color:var(--text-2);margin:0}
.code .kw{color:var(--violet-lift);font-weight:600}
.vs{display:grid;gap:6px;font-size:13.5px}
.vs div{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:8px 10px;border-radius:var(--r-s);line-height:1.45}
.vs .minus{background:rgba(255,107,90,.07);color:#E4B2AB}
.vs .plus{background:rgba(62,213,152,.07);color:#B8E6CF}
.vs span:first-child{font-weight:600}

/* ---------- loop rail ---------- */
.rail{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--border)}
.rail button{padding:16px;text-align:left;border-right:1px solid var(--border);position:relative;transition:background var(--t-fast)}
.rail button:last-child{border-right:0}
.rail button:hover{background:rgba(235,231,226,.02)}
.rail .n{font-size:12px;color:var(--text-3)}
.rail .t{display:block;font-family:var(--f-head);font-size:17px;margin-top:2px;color:var(--text-2);transition:color var(--t-fast)}
.rail button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--violet);transform:scaleX(0);transform-origin:left;transition:transform var(--t-base) var(--e-out)}
.rail button[aria-selected="true"] .t{color:var(--text)}
.rail button[aria-selected="true"]::after{transform:scaleX(1)}
.rail-body{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:var(--s-6);padding:28px 24px;min-height:210px}
.rail-body .k{font-size:12px;color:var(--text-3);margin-bottom:8px}
.rail-body .d{font-family:var(--f-head);font-size:21px;line-height:1.3;letter-spacing:-.015em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:4px 10px;border-radius:var(--r-full);background:rgba(235,231,226,.05);color:var(--text-2)}
.tag.on{background:var(--accent-soft);color:var(--violet-lift)}
.tag.rd{background:var(--tech-white);color:var(--void);font-weight:500}
.tag.go{background:rgba(62,213,152,.12);color:var(--ok);font-weight:500;display:inline-flex;align-items:center;gap:7px;box-shadow:inset 0 0 0 1px rgba(62,213,152,.35)}
.tag.go::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(62,213,152,.18),0 0 10px rgba(62,213,152,.7)}
.feed-note{font-size:13.5px;color:var(--text-2);margin-top:14px}

/* ---------- stat blocks (contrasting) ---------- */
.sblocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sb{border-radius:var(--r-l);padding:24px 24px 22px;min-height:220px;display:flex;flex-direction:column;color:var(--void)}
.sb .v{font-family:var(--f-head);font-size:clamp(38px,4.4vw,54px);letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.sb .l{margin-top:10px;font-size:var(--fs-16);font-weight:500}
.sb .from{font-size:var(--fs-16);margin-top:4px;opacity:.72}
.sb .m{margin-top:auto;padding-top:18px;font-size:var(--fs-18);line-height:1.45;opacity:.8}
.sb .ck{display:inline-flex;align-self:flex-start;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:var(--r-s);background:rgba(255,255,255,.6);font-size:var(--fs-20);line-height:1;font-weight:500;margin-bottom:18px}
.sb .ck::before{content:"";width:7px;height:7px;border-radius:50%;background:#1F9E6C}
.sb.c-white{background:var(--tech-white)}
.sb.c-violet{background:var(--violet);color:#fff}.sb.c-violet .ck{background:rgba(255,255,255,.18)}.sb.c-violet .ck::before{background:#9BF0CB}
.sb.c-tint{background:#DCD6FF}
.sb.c-stone{background:#CFC9C1}
.sb.c-dark{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}.sb.c-dark .ck{background:rgba(235,231,226,.07)}.sb.c-dark .ck::before{background:var(--ok)}
.sb.c-deep{background:#5B45E0;color:#fff}.sb.c-deep .ck{background:rgba(255,255,255,.16)}.sb.c-deep .ck::before{background:#9BF0CB}


ul.clean{list-style:none;margin:0;padding:0}

/* ---------- process stepper ---------- */
.proc-ph{display:grid;grid-template-columns:1fr 3fr 2fr;border-bottom:1px solid var(--border)}
.proc-ph>div{padding:12px 16px;border-right:1px solid var(--border);font-size:var(--fs-16);color:var(--text-3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.proc-ph>div:last-child{border-right:0}
.proc-ph b{color:var(--text-2);font-weight:500}
.proc-rail{display:grid;grid-template-columns:repeat(6,1fr);position:relative;padding:22px 8px 38px}
.proc-rail::before{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:37px;height:1px;background:var(--border-strong)}
.proc-rail .fill{position:absolute;left:calc(100%/12);top:37px;height:2px;margin-top:-.5px;background:var(--violet);transition:width var(--t-base) var(--e-out)}
.proc-rail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 4px;font-size:var(--fs-18);color:var(--text-2)}
.proc-rail .dot{width:30px;height:30px;border-radius:50%;background:var(--frame);border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;transition:all var(--t-base) var(--e-out);position:relative;z-index:1}
.proc-rail button.done .dot{border-color:var(--violet);color:var(--violet-lift)}
.proc-rail button[aria-selected="true"] .dot{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:0 0 0 5px rgba(117,96,255,.18)}
.proc-rail button[aria-selected="true"]{color:var(--text)}
.proc-loop{position:absolute;right:calc(100%/12 - 15px);top:86px;color:var(--violet-lift)!important;font-size:11.5px;color:var(--text-3);white-space:nowrap;transform:translateX(50%);pointer-events:none}
.proc-body{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:var(--s-6);padding:22px 24px 26px;border-top:1px solid var(--border);min-height:170px}
.proc-body .k{font-size:var(--fs-16);color:var(--text-3);margin-bottom:8px}
.proc-body .d{font-family:var(--f-head);font-size:22px;line-height:1.25;letter-spacing:-.015em}
.proc-body p{margin:0;font-size:var(--fs-16);color:var(--text-2);line-height:1.55}
.proc-body .gate{padding-left:14px;border-left:2px solid var(--warn)}
.proc-body .get{padding-left:14px;border-left:2px solid var(--ok)}

/* ---------- GTM: problem, chain, principles, applies ---------- */
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-5)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-6) var(--s-5)}
.pt{border-top:1px solid var(--hair);padding-top:16px}
.pt .n{font-size:12px;color:var(--text-3)}
.pt h3{margin:6px 0 8px}
.pt p{margin:0;font-size:14.5px;color:var(--text-2);line-height:1.55}
.why{background:var(--tech-white);color:var(--void);border-radius:var(--r-xl);padding:var(--s-7) var(--s-7) var(--s-6)}
.why .label{color:#4A4C55}
.why .h2{color:var(--void);margin:12px 0 10px;max-width:20ch}
.why .lead{color:#4A4C55;max-width:56ch}
.why .g4{margin-top:var(--s-6)}
.why .pt{border-top-color:rgba(13,14,16,.14)}
.why .pt h3{color:var(--void)}
.why .pt p{color:#4A4C55}
.chain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.chain>div{padding:22px 18px 24px;border-right:1px solid var(--border);position:relative}
.chain>div:last-child{border-right:0}
.chain>div:not(:last-child)::after{content:"";position:absolute;right:-6px;top:32px;width:10px;height:10px;border-top:1px solid var(--border-strong);border-right:1px solid var(--border-strong);transform:rotate(45deg);background:var(--frame);z-index:1}
.chain .n{font-size:12px;color:var(--text-3)}
.chain .t{font-family:var(--f-head);font-size:19px;margin:6px 0 6px;letter-spacing:-.01em}
.chain p{margin:0;font-size:13.5px;color:var(--text-2);line-height:1.5}
.chain>div:nth-child(4){background:rgba(117,96,255,.07)}
.alias{font-size:12.5px;color:var(--violet-lift);font-family:var(--f-body);font-weight:500;letter-spacing:0;display:block;margin-top:6px}
.applies{display:flex;flex-wrap:wrap;gap:8px}
.applies span{position:relative;display:inline-flex;flex-direction:column;justify-content:center;min-width:170px;min-height:74px;flex:1 1 170px;padding:12px 54px 12px 16px;border:1px solid var(--border);border-radius:var(--r);background:linear-gradient(180deg,rgba(235,231,226,.045),rgba(235,231,226,.018));overflow:hidden;transition:border-color var(--t-fast),background var(--t-fast),transform var(--t-fast)}
.applies span::before{content:attr(data-n);position:absolute;right:14px;top:10px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--text-3);font-variant-numeric:tabular-nums}
.applies span::after{content:"";position:absolute;right:14px;bottom:12px;width:32px;height:18px;opacity:.72;background:radial-gradient(circle at 3px 9px,var(--violet-lift) 0 2px,transparent 2.4px),radial-gradient(circle at 16px 5px,var(--text-3) 0 2px,transparent 2.4px),radial-gradient(circle at 29px 13px,var(--text-3) 0 2px,transparent 2.4px),linear-gradient(160deg,transparent 0 30%,var(--border-strong) 31% 34%,transparent 35% 100%)}
.applies span:hover{border-color:var(--accent-line);background:linear-gradient(180deg,rgba(117,96,255,.07),rgba(235,231,226,.018));transform:translateY(-1px)}
.applies b{font-weight:500;color:var(--text);font-size:15px;line-height:1.3}
.applies i{font-style:normal;font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.35}
.usp{font-family:var(--f-head);font-size:clamp(24px,3vw,36px);line-height:1.2;letter-spacing:-.02em;max-width:30ch;color:var(--text)}
.usp-k{font-size:13px;color:var(--text-3);margin-bottom:12px}

/* ---------- engagement / systems cards in tracks ---------- */
.ecard{flex:0 0 calc((var(--col) - 32px) / 2.5);scroll-snap-align:start;display:flex;flex-direction:column;border-radius:var(--r-l);
  background:linear-gradient(180deg,#16171C,var(--frame));border:1px solid var(--border);padding:22px 22px 20px;min-height:250px}
.ecard .n{font-size:12px;color:var(--text-3)}
.ecard h3{margin:8px 0 8px}
.ecard p{margin:0;font-size:14.5px;color:var(--text-2);line-height:1.55}
.ecard .dur{margin-top:auto;padding-top:18px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--text-2)}
.ecard .dur b{font-family:var(--f-head);font-size:20px;color:var(--text);font-weight:500;letter-spacing:-.01em}
.ecard.hl{background:var(--violet);border-color:var(--violet);color:#fff}
.ecard.hl .n,.ecard.hl p,.ecard.hl .dur{color:rgba(255,255,255,.85)}
.ecard.hl h3,.ecard.hl .dur b{color:#fff}
.sym{font-size:14px;color:var(--text-2);font-style:italic;margin:4px 0 0}
.chainline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:var(--s-4)}
.chainline span{font-size:13px;padding:5px 11px;border-radius:var(--r-full);background:rgba(235,231,226,.05);color:var(--text-2)}
.chainline span.dec{background:var(--accent-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent-line)}
.chainline i{font-style:normal;color:var(--text-3);font-size:12px}
.wcard .trio{margin-top:var(--s-5);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:rgba(0,0,0,.18)}
.wcard .trio>div{padding:16px 18px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s-6)}
.jump button{height:32px;padding:0 13px;border-radius:var(--r-full);font-size:13.5px;color:var(--text-2);border:1px solid var(--border);transition:all var(--t-fast)}
.jump button:hover{color:var(--text);border-color:var(--border-strong)}
.jump button[aria-current="true"]{color:var(--void);background:var(--tech-white);border-color:var(--tech-white)}

/* ---------- Work: experience ---------- */
.xp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s-5);padding:22px 24px;border-bottom:1px solid var(--hair)}
.xp:last-child{border-bottom:0}
.xp .when{font-size:13.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.xp .when i{display:block;font-style:normal;font-size:12.5px;color:var(--text-3);margin-top:2px}
.xp .role{font-family:var(--f-head);font-size:20px;letter-spacing:-.015em;color:var(--text)}
.xp .org{font-size:14px;color:var(--text-2);margin-top:2px}
.xp ul{margin:12px 0 0;padding:0;list-style:none}
.xp li{position:relative;padding-left:16px;font-size:14.5px;color:var(--text-2);line-height:1.55;margin:6px 0}
.xp li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:1.5px;background:var(--violet)}
.xp .tags{margin-top:12px}
.certs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.certs>div{padding:16px 24px;border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);font-size:14.5px;color:var(--text)}
.certs>div:nth-child(2n){border-right:0}
.certs i{display:block;font-style:normal;font-size:12.5px;color:var(--text-3);margin-top:2px}
.pub{padding:26px 24px}
.pub .t{font-family:var(--f-head);font-size:22px;letter-spacing:-.015em;line-height:1.3;max-width:34ch}
.pub .s{font-size:13.5px;color:var(--text-2);margin-top:8px}

/* ---------- refusal list ---------- */
.nots{display:grid;grid-template-columns:repeat(2,1fr);gap:0 var(--s-7)}
.nots li{display:grid;grid-template-columns:18px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--hair);color:var(--text-2);font-size:var(--fs-18)}
.nots li::before{content:"";width:12px;height:1.5px;background:var(--stop);margin-top:11px}
.nots li b{color:var(--text);font-weight:500}

/* ---------- cross links (Linear four-tile row) ---------- */
.xl{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.xl a{padding:28px 22px 26px;border-right:1px solid var(--hair);display:flex;flex-direction:column;gap:10px;min-height:170px;transition:background var(--t-base)}
.xl a:last-child{border-right:0}
.xl a:hover{background:rgba(235,231,226,.025)}
.xl .t{font-family:var(--f-head);font-size:18px;line-height:1.3;letter-spacing:-.01em;color:var(--text)}
.xl .s{margin-top:auto;font-size:var(--fs-16);color:var(--text-2)}

/* ---------- closing band ---------- */
.close{padding:var(--s-8) 0 var(--s-9)}
.close .blk{background:var(--tech-white);color:var(--void);border-radius:var(--r-xl);padding:var(--s-8) var(--s-8) var(--s-7);position:relative;overflow:hidden}
.close .blk .h2{color:var(--void);max-width:18ch}
.close .blk .p{color:#4A4C55}
.close .blk .btn-p{background:var(--void);color:var(--tech-white)}
.close .blk .btn-p:hover{background:#000}
.close .blk .btn-s{border-color:rgba(13,14,16,.28);color:var(--void)}
.close .blk .btn-s:hover{background:rgba(13,14,16,.06);border-color:rgba(13,14,16,.5)}
.close .blk .risk{color:#4A4C55}
.close .blk :focus-visible{outline-color:var(--void)}
.close .loopfig{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:340px;height:340px;pointer-events:none}
.close .p{margin-top:var(--s-4)}
.close .dual{margin-top:var(--s-6)}
.close .risk{margin-top:var(--s-4);font-size:13.5px}

/* ---------- footer ---------- */
.ftr{border-top:1px solid var(--hair);padding:var(--s-8) 0 var(--s-7);font-size:13.5px}
.ftr-g{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:var(--s-6)}
.ftr h4{font-family:var(--f-body);font-size:13.5px;font-weight:500;margin-bottom:12px}
.ftr li{margin:7px 0}
.ftr li a{color:var(--text-2);transition:color var(--t-fast)}
.ftr li a:hover{color:var(--text)}
.ftr .stmt{color:var(--text-2);max-width:34ch;margin:14px 0 0}
.ftr .base{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;margin-top:var(--s-7);padding-top:var(--s-5);border-top:1px solid var(--hair);color:var(--text-3)}

/* ---------- GTM: layers, clash, table ---------- */
.clash{display:grid;grid-template-columns:130px repeat(4,1fr)}
.clash>div{padding:14px 16px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:14px;color:var(--text-2)}
.clash>div:nth-child(5n){border-right:0}
.clash .rh{font-size:12px;color:var(--text-3)}
.clash .ch{font-family:var(--f-head);font-size:16px;color:var(--text)}
.clash-dl{display:grid;grid-template-columns:130px 1fr;border-top:1px solid var(--accent-line);background:rgba(117,96,255,.07)}
.clash-dl>div{padding:18px 16px;font-size:14px}
.clash-dl .rh{font-size:12px;color:var(--violet-lift)}
.clash-dl .d{font-family:var(--f-head);font-size:19px;letter-spacing:-.01em}
.clash-dl .w{color:var(--text-2);margin-top:4px}
.layer{display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--s-6);padding:var(--s-6) 0;border-top:1px solid var(--hair)}
.layer:first-child{border-top:0;padding-top:0}
.layer .nm{font-family:var(--f-head);font-size:15px;color:var(--text-2)}
.layer .nm b{display:block;font-size:26px;color:var(--text);font-weight:500;letter-spacing:-.02em;margin-top:2px}
.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-5);margin-top:var(--s-4)}
.pl div{font-size:14.5px;color:var(--text-2);line-height:1.55}
.pl .k{display:block;font-size:12px;color:var(--text-3);margin-bottom:6px}
.pl .pv{color:var(--text)}
.pl .pv .k{color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl th{font-weight:500;color:var(--text);font-size:13.5px}
.tbl td:first-child{color:var(--text-3);font-size:12.5px;width:130px}
.tbl td{color:var(--text-2)}
.tbl tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* ---------- Systems: flow ---------- */
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
.trio>div{padding:20px 24px;border-right:1px solid var(--border);font-size:14.5px;color:var(--text-2)}
.trio>div:last-child{border-right:0}
.trio .fig{font-family:var(--f-head);font-size:28px;color:var(--text);letter-spacing:-.02em;line-height:1.1;display:block;margin-bottom:4px}
.trio .k{display:block;font-size:12px;color:var(--text-3);margin-bottom:8px}
.fit{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-5)}
.fit div{border-top:1px solid var(--hair);padding-top:14px;font-size:14.5px;color:var(--text-2)}
.fit b{display:block;color:var(--text);font-weight:500;margin-bottom:4px}

/* ---------- Work: horizontal card track ---------- */
.trk-bar{display:flex;align-items:center;gap:12px;margin-top:var(--s-5)}
.trk-bar .cnt{font-size:13.5px;color:var(--text-2);font-variant-numeric:tabular-nums;margin-right:auto}
.trk-bar .cnt b{color:var(--text);font-weight:500}
.trk-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;transition:background var(--t-fast),opacity var(--t-fast)}
.trk-btn:hover{background:rgba(235,231,226,.06)}
.trk-btn:disabled{opacity:.3;cursor:default;background:none}
.trk-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.trk-prog{height:2px;background:var(--border);border-radius:2px;margin-top:14px;overflow:hidden}
.trk-prog i{display:block;height:100%;width:0;background:var(--violet);border-radius:2px;transition:width var(--t-fast) linear}
.trk{position:relative;--edge:max(var(--gut),calc((100vw - var(--wrap)) / 2 + var(--gut)));--col:calc(min(100vw,var(--wrap)) - 2 * var(--gut));
  display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:var(--edge);
  padding:var(--s-5) var(--edge) var(--s-4);scrollbar-width:none;overscroll-behavior-x:contain}
.trk::-webkit-scrollbar{display:none}
.trk:focus-visible{outline:2px solid var(--violet);outline-offset:-2px;border-radius:var(--r)}
.wcard{flex:0 0 calc((var(--col) - 16px) / 1.5);scroll-snap-align:start;display:flex;flex-direction:column;
  border-radius:var(--r-l);background:linear-gradient(180deg,#16171C,var(--frame));border:1px solid var(--border);padding:26px 28px 24px}
.wcard[hidden]{display:none}
.wcard-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.wcard-h .h3{max-width:22ch;flex:1 1 280px}
.wcard-h .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;flex:0 1 auto;padding-top:4px}
.wcard .p{margin-top:var(--s-3);font-size:15px}
.wcard .mstrip{margin-top:var(--s-5)}
.wcard .cl{margin-top:var(--s-5)}
.wcard .spacer{flex:1}

/* ---------- Work: shared bits ---------- */
.flt{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s-6)}
.flt button{height:32px;padding:0 13px;border-radius:var(--r-full);font-size:13.5px;color:var(--text-2);border:1px solid var(--border);transition:all var(--t-fast)}
.flt button:hover{color:var(--text);border-color:var(--border-strong)}
.flt button[aria-pressed="true"]{color:var(--void);background:var(--tech-white);border-color:var(--tech-white)}
.mstrip{display:flex;flex-wrap:wrap;margin:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--frame)}
.mstrip>div{flex:1;min-width:160px;padding:18px 20px;border-right:1px solid var(--border)}
.mstrip>div:last-child{border-right:0}
.mstrip .v{font-family:var(--f-head);font-size:30px;letter-spacing:-.025em;line-height:1.05;font-variant-numeric:tabular-nums}
.mstrip .l{font-size:13px;color:var(--text-2);margin-top:6px;line-height:1.4}
.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s-5) var(--s-7);margin-top:var(--s-5)}
.cl h4{font-family:var(--f-body);font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:6px}
.cl li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--hair);font-size:14px;color:var(--text-2)}
.cl li span:first-child{color:var(--text-3);font-size:12.5px;padding-top:1px}
.empty{padding:var(--s-8) 0;color:var(--text-2)}

/* ---------- Simulators ---------- */
.simnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s-6)}
.sim-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.sim-head .lbl{font-size:12.5px;color:var(--text-3);margin-right:4px}
.seg{height:30px;padding:0 12px;border-radius:var(--r-full);font-size:13px;color:var(--text-2);border:1px solid var(--border);transition:all var(--t-fast)}
.seg:hover{color:var(--text)}
.seg.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.seg.reset{margin-left:auto}
.sim-body{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.sim-in{padding:16px;border-right:1px solid var(--border)}
.srow{display:grid;grid-template-columns:1fr 128px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.srow label{font-size:14px;color:var(--text)}
.srow label i{display:block;font-style:normal;font-size:12px;color:var(--text-3)}
.srow input{height:36px;border-radius:var(--r-s);border:1px solid var(--border-strong);background:rgba(0,0,0,.25);padding:0 10px;text-align:right;
  font-variant-numeric:tabular-nums;width:100%}
.srow input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--accent-soft)}
.srow.bad input{border-color:var(--stop)}
.sim-note{font-size:12.5px;color:var(--text-3);margin-top:12px;line-height:1.5}
.sim-out{padding:16px 18px}
.sstep{margin-bottom:12px}
.sstep-t{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:5px}
.sstep-t .v{font-variant-numeric:tabular-nums;color:var(--text)}
.sstep.weak .n{color:var(--text)}
.strack{position:relative;height:8px;border-radius:4px;background:rgba(235,231,226,.06)}
.sfill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--gray-500);transition:width var(--t-base) var(--e-out)}
.sstep.weak .sfill{background:var(--warn)}
.sghost{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:rgba(117,96,255,.35)}
.sbench{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.7}
.sverdict{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.sverdict .k,.snext .k{font-size:12px;color:var(--text-3);margin-bottom:6px}
.sverdict h4{font-family:var(--f-head);font-size:20px;letter-spacing:-.015em;line-height:1.25}
.sverdict p{font-size:14px;color:var(--text-2);margin:8px 0 0}
.sslider{margin-top:14px}
.sslider .sk{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:6px}
.sslider .sk b{color:var(--text);font-weight:500}
input[type=range]{width:100%;accent-color:var(--violet)}
.sproj{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.spc{border:1px solid var(--border);border-radius:var(--r-s);padding:12px 14px}
.spc.hi{border-color:var(--accent-line);background:rgba(117,96,255,.07)}
.spc .k2{font-size:12px;color:var(--text-3)}
.spc .v2{font-family:var(--f-head);font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.spc .s2{font-size:12.5px;color:var(--text-2)}
.swarn{margin-top:12px;font-size:13.5px;color:var(--text-2);padding:10px 12px;border-radius:var(--r-s);background:rgba(224,160,48,.08)}
.swarn b{color:var(--warn);font-weight:500}
.snext{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.sinv{display:grid;grid-template-columns:26px 1fr;gap:6px;font-size:14px;color:var(--text-2);padding:6px 0}
.sinv b{color:var(--text-3);font-weight:500;font-size:12.5px;padding-top:1px}
.snext .dual{margin-top:14px}

.dt{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.dt-in{padding:16px;border-right:1px solid var(--border)}
.dt-k{font-size:12px;color:var(--text-3);margin:4px 0 8px}
.dt-k.gap{margin-top:18px}
.dt-e,.dt-c{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-s);font-size:14px;color:var(--text-2);transition:background var(--t-fast),color var(--t-fast)}
.dt-e:hover,.dt-c:hover{background:rgba(235,231,226,.04);color:var(--text)}
.dt-e b{font-size:12px;color:var(--text-3);font-weight:500;width:18px}
.dt-e.on{background:var(--accent-soft);color:var(--text)}
.dt-c .sw{width:28px;height:16px;border-radius:8px;background:var(--gray-800);position:relative;flex-shrink:0;transition:background var(--t-base)}
.dt-c .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--gray-300);transition:transform var(--t-base) var(--e-spring),background var(--t-base)}
.dt-c.on{color:var(--text)}
.dt-c.on .sw{background:var(--violet)}
.dt-c.on .sw::after{transform:translateX(12px);background:#fff}
.dt-c.warn.on .sw{background:var(--warn)}
.dt-out{padding:18px 20px}
.st{display:grid;grid-template-columns:16px 1fr;gap:12px}
.st-rail{display:flex;flex-direction:column;align-items:center}
.st-dot{width:9px;height:9px;border-radius:50%;background:var(--violet);margin-top:5px;flex-shrink:0}
.st-line{flex:1;width:1px;background:var(--border-strong);margin:4px 0}
.st:last-child .st-line{display:none}
.st-c{padding-bottom:18px;min-width:0}
.st-k{font-size:12px;color:var(--text-3)}
.st-h{font-family:var(--f-head);font-size:17px;line-height:1.35;margin-top:2px;letter-spacing:-.01em}
.st-p{font-size:13.5px;color:var(--text-2);margin-top:4px}
.st-sup{margin-bottom:16px;padding:12px 14px;border-radius:var(--r-s);background:rgba(224,160,48,.08);font-size:13.5px;color:var(--text-2)}
.st-sup b{display:block;color:var(--warn);font-weight:500;margin-bottom:2px}
.rl2{margin-top:10px;border:1px solid var(--border);border-radius:var(--r-s);overflow:hidden}
.rl2-h{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:12px;color:var(--text-3);border-bottom:1px solid var(--border)}
.rl2-r{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:7px 12px;font-size:13px;border-bottom:1px solid var(--hair)}
.rl2-r:last-child{border-bottom:0}
.rl2-r.win{color:var(--text);background:rgba(117,96,255,.07)}
.rl2-r.lose{color:var(--text-3)}
.rl2-p{font-variant-numeric:tabular-nums}
.rl2-s{font-size:12px}
.st-code{margin-top:10px}
.st-guard{margin-top:10px;font-size:13px;color:var(--text-2);padding:8px 12px;border-left:2px solid var(--warn)}
.st-guard b{color:var(--warn);font-weight:500}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ch2{font-size:12.5px;padding:5px 11px;border-radius:var(--r-full);border:1px solid var(--border);color:var(--text-3)}
.ch2.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--text)}
.ch2.none{border-color:rgba(224,160,48,.4);color:var(--warn)}

/* ---------- mobile side dial — ported from side-nav-prototype-v8.html ---------- */
.dial,.dial-hint,.hdr-m{display:none}
.dial{position:fixed;top:50%;right:0;transform:translateY(-50%);z-index:60;width:42px;height:150px;align-items:center;justify-content:center;
  border-radius:26px 0 0 26px;background:linear-gradient(205deg,#2c2d33,#111216);border:1px solid rgba(255,255,255,.06);border-right:none;
  box-shadow:-4px 0 18px rgba(0,0,0,.45),inset 1px 0 0 rgba(255,255,255,.05);touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent;
  transition:width .34s var(--e-spring),height .34s var(--e-spring),border-color .18s ease,opacity .45s ease}
.dial:focus{outline:none}
.dial:focus-visible{outline:2px solid var(--violet-lift);outline-offset:3px}
.dial.idle{opacity:.5}
.dial.engaged{width:min(224px,calc(100vw - 24px));height:min(380px,calc(100dvh - 140px));border-color:transparent;background:transparent;box-shadow:none;cursor:grabbing;opacity:1}
.dial.engaged::before{content:"";position:absolute;right:-170px;top:50%;width:360px;height:360px;transform:translateY(-50%);border-radius:50%;
  border:1px solid rgba(255,255,255,.06);background:radial-gradient(circle at 60% 50%,rgba(42,43,49,.94) 0 52%,transparent 53%);pointer-events:none}
.dial-rest{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;height:100%}
.dial.engaged .dial-rest{display:none}
.peek{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:var(--text-3);opacity:.42;transform:scale(.72);transition:opacity .2s,transform .2s}
.peek svg,.witem svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px}
.peek.cur{opacity:1;transform:scale(1.15);color:var(--violet-lift);background:rgba(117,96,255,.16)}
.peek.cur svg{width:19px;height:19px}
.dial-grip{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:4px;height:20px;border-radius:3px;background:rgba(255,255,255,.14)}
.dial.engaged .dial-grip{opacity:0}
.dial-grip.pulse{animation:gripPulse 1.1s ease-in-out 2}
@keyframes gripPulse{0%,100%{box-shadow:0 0 0 0 rgba(117,96,255,.5)}50%{box-shadow:0 0 0 7px rgba(117,96,255,0)}}
.wlist{display:none;position:absolute;inset:0}
.dial.engaged .wlist{display:block}
.witem{--wy:0px;--wr:22px;--ws:.82;--wo:.26;--wrot:0deg;position:absolute;right:var(--wr);top:calc(50% + var(--wy));min-width:44px;height:40px;padding:0 12px 0 14px;
  display:flex;align-items:center;justify-content:flex-end;gap:9px;border-radius:20px;color:var(--text-3);background:rgba(42,43,49,.86);border:1px solid var(--border-strong);
  box-shadow:0 7px 20px rgba(0,0,0,.3);opacity:var(--wo);white-space:nowrap;transform:translateY(-50%) rotate(var(--wrot)) scale(var(--ws));transform-origin:right center;
  transition:top .22s var(--e-out),right .22s var(--e-out),transform .22s var(--e-out),opacity .16s ease,background .16s ease,color .16s ease}
.witem.hid{visibility:hidden}
.witem span{font:600 12.5px/1 var(--f-body);max-width:130px;overflow:hidden;text-overflow:ellipsis}
.witem.focused{color:#fff;background:var(--violet);border-color:var(--violet);box-shadow:0 10px 26px rgba(117,96,255,.32)}
.witem.near{color:var(--text)}
.dial-hint{position:fixed;top:50%;right:54px;transform:translateY(-50%) translateX(4px);z-index:59;background:var(--gray-800);border:1px solid var(--border-strong);
  color:var(--text-2);font-size:12px;padding:8px 12px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.4);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
.dial-hint.show{opacity:1;transform:translateY(-50%) translateX(0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- reveal + count-up (motion budget: reveals, count-up only) ---------- */
.rv{opacity:0;transform:translateY(14px);transition:opacity var(--t-slow) var(--e-out),transform var(--t-slow) var(--e-out)}
.rv.in{opacity:1;transform:none}
.hero .rv{transition-duration:720ms}
.hero .rv.d1{transition-delay:80ms}.hero .rv.d2{transition-delay:160ms}.hero .rv.d3{transition-delay:240ms}.hero .rv.d4{transition-delay:340ms}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  *{transition-duration:0ms!important;animation:none!important;scroll-behavior:auto!important}
}
